        const saved = localStorage.getItem("dearhome_meallogs");
        return saved ? JSON.parse(saved) : [];
      });

      const [ledgerEvents, setLedgerEvents] = useState(() => {
        const saved = localStorage.getItem("dearhome_ledger");
        return saved ? JSON.parse(saved) : [
          {
            id: "ev-1",
            type: "CREDIT",
            title: "Zepto Delivery Ingested",
            subtitle: "3 items added (+2L Milk, +5kg Atta, +1kg Tomato)",
            time: "Today, 10:30 AM",
            amount: "₹385",
            source: "OCR Scanner"
          }
        ];
      });

      const [activeTab, setActiveTab] = useState("scan");
      const [isAddItemModalOpen, setIsAddItemModalOpen] = useState(false);
      const [isNotificationCenterOpen, setIsNotificationCenterOpen] = useState(false);
      const [isThresholdModalOpen, setIsThresholdModalOpen] = useState(false);
      const [selectedItemForAlert, setSelectedItemForAlert] = useState(null);

      const [isListening, setIsListening] = useState(false);
      const [customUploadedFile, setCustomUploadedFile] = useState(null);
      const [dietFilter, setDietFilter] = useState("All Diets");

      const [notificationsList, setNotificationsList] = useState(() => {
        const saved = localStorage.getItem("dearhome_notifications");
        return saved ? JSON.parse(saved) : [
          {
            id: "notif-1",
            title: "🚨 Low Stockout Alert: Amul Milk",
            body: "Only 0.5 L remaining in your kitchen. Estimated runout: Tonight.",
            time: "10 mins ago",
            severity: "critical",
            itemId: "item-15",
            unread: true
          }
        ];
      });

      const [selectedCategory, setSelectedCategory] = useState("All Items");
      const [searchQuery, setSearchQuery] = useState("");
      const [guestCountForMeal, setGuestCountForMeal] = useState(0);
      const [toast, setToast] = useState(null);

      const [selectedInvoice, setSelectedInvoice] = useState(SAMPLE_INVOICES[0]);
      const [isScanning, setIsScanning] = useState(false);
      const [scanResult, setScanResult] = useState(SAMPLE_INVOICES[0]);

      const [chatMessages, setChatMessages] = useState([
        {
          id: "m-1",
          sender: "ai",
          text: "Namaste Sinduja! I am your DearHome AI Kitchen Assistant. I have live knowledge of all items in your kitchen. You can ask what to cook, check what is in your pantry, or use your voice to add groceries!",
          suggestions: [
            "What is present in my pantry list?",
            "What can I cook with what I have?",
            "Which items are expiring soon?",
            "Do I have Basmati Rice?"
          ]
        }
      ]);
      const [userChatInput, setUserChatInput] = useState("");
      const [isAiThinking, setIsAiThinking] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => { localStorage.setItem("dearhome_household", JSON.stringify(household)); }, [household]);
      useEffect(() => { localStorage.setItem("dearhome_pantry", JSON.stringify(pantry)); }, [pantry]);
      useEffect(() => { localStorage.setItem("dearhome_meallogs", JSON.stringify(mealLogs)); }, [mealLogs]);
      useEffect(() => { localStorage.setItem("dearhome_ledger", JSON.stringify(ledgerEvents)); }, [ledgerEvents]);
      useEffect(() => { localStorage.setItem("dearhome_notifications", JSON.stringify(notificationsList)); }, [notificationsList]);
      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatMessages, isAiThinking]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const startVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast("Speech recognition is not supported on this browser.");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        showToast("🎙️ Listening... speak now!");

        recognition.onresult = (event) => {
          const spokenText = event.results[0][0].transcript;
          setUserChatInput(spokenText);
          setIsListening(false);
          showToast(`Heard: "${spokenText}"`);
          setTimeout(() => {
            handleSendMessage(spokenText);
          }, 300);
        };

        recognition.onerror = (event) => {
          setIsListening(false);
          showToast("Microphone error: " + event.error);
        };

        recognition.onend = () => {
          setIsListening(false);
        };

        try {
          recognition.start();
        } catch (err) {
          setIsListening(false);
        }
      };

      const appetiteMultiplier = useMemo(() => {
        if (household.appetiteLevel && household.appetiteLevel.indexOf("Light") !== -1) return 0.75;
        if (household.appetiteLevel && household.appetiteLevel.indexOf("Hearty") !== -1) return 1.30;
        return 1.0;
      }, [household.appetiteLevel]);

      const baseFamilyServings = useMemo(() => {
        const rawEaters = (household.adults * 1.0) + (household.children * 0.6) + (household.elders * 0.85);
        return Math.max(1, +(rawEaters * appetiteMultiplier).toFixed(1));
      }, [household, appetiteMultiplier]);

      const totalMealEaters = Math.max(1, +(baseFamilyServings + (guestCountForMeal * appetiteMultiplier)).toFixed(1));
      const lowStockItems = useMemo(() => pantry.filter(i => i.current <= i.threshold), [pantry]);
      const expiringItems = useMemo(() => pantry.filter(i => (i.daysExpiry || 99) <= 3), [pantry]);

      const updateStock = (id, delta) => {
        setPantry(prev => prev.map(item => {
          if (item.id === id) {
            const nextVal = Math.max(0, +(item.current + delta).toFixed(2));
            return { ...item, current: nextVal };
          }
          return item;
        }));
      };

      // COOK MEAL WITH PRE-FLIGHT & REVERSIBILITY
      const handleCookMealDirect = (recipeId, effectiveServings) => {
        const recipe = INDIAN_RECIPES.find(r => r.id === recipeId);
        if (!recipe) return;

        let deductions = [];
        let updatedPantry = [...pantry];

        recipe.ingredients.forEach(ing => {
          const index = updatedPantry.findIndex(p =>
            p.shortName.toLowerCase() === ing.name.toLowerCase() ||
            p.name.toLowerCase().indexOf(ing.name.toLowerCase()) !== -1 ||
            ing.name.toLowerCase().indexOf(p.shortName.toLowerCase()) !== -1
          );

          if (index !== -1) {
            const item = updatedPantry[index];
            let deductionAmount = ing.qty * effectiveServings;
            if (ing.unit === "g" && item.unit === "kg") deductionAmount /= 1000;
            if (ing.unit === "ml" && item.unit === "L") deductionAmount /= 1000;

            const nextQty = Math.max(0, +(item.current - deductionAmount).toFixed(2));
            updatedPantry[index] = { ...item, current: nextQty };
            deductions.push({ 
              itemId: item.id,
              name: item.shortName, 
              amountDeducted: +(item.current - nextQty).toFixed(2),
              unit: item.unit,
              displayQty: (ing.qty * effectiveServings).toFixed(1) + " " + ing.unit 
            });
          }
        });

        setPantry(updatedPantry);

        const newLog = {
          id: "log-" + Date.now(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          recipeName: recipe.name,
          servings: effectiveServings,
          deductions
        };

        setMealLogs(prev => [newLog, ...prev]);

        // Add to Ledger
        const newLedgerEvent = {
          id: "ev-" + Date.now(),
          type: "DEBIT",
          title: `Cooked ${recipe.name}`,
          subtitle: `${effectiveServings} portions (${deductions.map(d => d.name).join(', ')})`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          amount: `${deductions.length} items deducted`,
          source: "Meal Depletion",
          logId: newLog.id
        };
        setLedgerEvents(prev => [newLedgerEvent, ...prev]);

        showToast(`🥘 Cooked ${recipe.name}! Deducted ${deductions.length} ingredients.`);
      };

      // 1-CLICK UNDO MEAL HANDLER
      const handleUndoMeal = (logId) => {
        const log = mealLogs.find(l => l.id === logId);
        if (!log) return;

        let restoredPantry = [...pantry];
        log.deductions.forEach(d => {
          const idx = restoredPantry.findIndex(p => p.id === d.itemId || p.shortName === d.name);
          if (idx !== -1) {
            restoredPantry[idx] = {
              ...restoredPantry[idx],
              current: +(restoredPantry[idx].current + d.amountDeducted).toFixed(2)
            };
          }
        });

        setPantry(restoredPantry);
        setMealLogs(prev => prev.filter(l => l.id !== logId));
        setLedgerEvents(prev => prev.filter(ev => ev.logId !== logId));
        showToast(`↩️ Undid ${log.recipeName}! Restored pantry stock.`);
      };

      const handleIngestInvoiceItems = (items, platformName) => {
        let updatedPantry = [...pantry];
        let ingestedList = [];

        items.forEach((item, idx) => {
          const lowerName = (item.shortName || item.name).toLowerCase();
          let matchIndex = updatedPantry.findIndex(p =>
            p.shortName.toLowerCase() === lowerName ||
            p.name.toLowerCase().indexOf(lowerName) !== -1 ||
            lowerName.indexOf(p.shortName.toLowerCase()) !== -1
          );

          if (matchIndex !== -1) {
            const existing = updatedPantry[matchIndex];
            const newQty = +(existing.current + item.qty).toFixed(2);
            updatedPantry[matchIndex] = {
              ...existing,
              current: newQty,
              max: Math.max(existing.max, newQty * 1.2)
            };
            ingestedList.push({ name: existing.shortName, qty: "+" + item.qty + " " + item.unit });
          } else {
            const newItem = {
              id: "item-" + Date.now() + "-" + idx,
              name: item.name,
              shortName: item.shortName || item.name,
              category: item.category || "Beverages and Snacks",
              current: item.qty,
              max: item.qty * 1.5,
              unit: item.unit,
              threshold: Math.max(1, +(item.qty * 0.25).toFixed(1)),
              dailyBurn: 0.1,
              price: parseInt(item.rate?.replace(/[^\d]/g, '') || 50),
              daysExpiry: 14
            };
            updatedPantry = [newItem, ...updatedPantry];
            ingestedList.push({ name: newItem.shortName, qty: "+" + item.qty + " " + item.unit });
          }
        });

        setPantry(updatedPantry);

        // Add to Ledger
        const newLedgerEvent = {
          id: "ev-" + Date.now(),
          type: "CREDIT",
          title: `${platformName} Ingested`,
          subtitle: `${items.length} items added (${ingestedList.map(i => i.qty + " " + i.name).join(', ')})`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          amount: `+${items.length} staples`,
          source: "OCR Ingestion"
        };
        setLedgerEvents(prev => [newLedgerEvent, ...prev]);

        showToast(`Ingested ${items.length} items from ${platformName}!`);
      };

      // CONVERSATIONAL AGENT MESSAGE HANDLER
      const handleSendMessage = (textToSend) => {
        const query = textToSend || userChatInput;
        if (!query.trim()) return;

        const userMsg = { id: "user-" + Date.now(), sender: "user", text: query };
        setChatMessages(prev => [...prev, userMsg]);
        setUserChatInput("");
        setIsAiThinking(true);

        setTimeout(() => {
          setIsAiThinking(false);
          const lower = query.toLowerCase().trim();

          // 1. WHAT IS IN PANTRY
          if (
            lower.includes("what is in my pantry") ||
            lower.includes("what is present in my pantry") ||
            lower.includes("show pantry") ||
            lower.includes("pantry list") ||
            lower.includes("kitchen inventory") ||
            lower.includes("list my items")
          ) {
            const inStock = pantry.filter(i => i.current > 0);
            const categorized = {};
            inStock.forEach(item => {
              if (!categorized[item.category]) categorized[item.category] = [];
              categorized[item.category].push(`${item.shortName || item.name} (${item.current} ${item.unit})`);
            });

            let breakdown = Object.entries(categorized)
              .map(([cat, items]) => `📁 **${cat}**:\n• ` + items.join(", "))
              .join("\n\n");

            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: `📦 **DearHome Kitchen Inventory (${pantry.length} items)**:\n\n${breakdown}\n\n${
                  expiringItems.length > 0 ? `⏳ *Notice: ${expiringItems.length} perishable item(s) are expiring in <=3 days.*` : `✨ *All groceries fresh and well-stocked.*`
                }`,
                suggestions: [
                  "What can I cook with what I have?",
                  "Which items are expiring soon?",
                  "Do I have Basmati Rice?"
                ]
              }
            ]);
            return;
          }

          // 2. EXPIRING SOON QUERY
          if (lower.includes("expir") || lower.includes("spoil") || lower.includes("waste")) {
            if (expiringItems.length === 0) {
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: "🌟 Great news! You have no critically expiring items in your kitchen right now.",
                  suggestions: ["What can I cook tonight?", "Show full pantry list"]
                }
              ]);
            } else {
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: `⏳ **Perishables Expiring within 3 Days (${expiringItems.length} items)**:\n\n` +
                    expiringItems.map(i => `• **${i.shortName}**: ${i.current} ${i.unit} (*Expires in ~${i.daysExpiry} days*)`).join("\n") +
                    `\n\n💡 *Tip: Cook recipes using these items first to prevent food waste!*`,
                  suggestions: ["What can I cook with expiring items?", "Show pantry list"]
                }
              ]);
            }
            return;
          }

          // 3. SPECIFIC ITEM AVAILABILITY
          if (lower.startsWith("do i have") || lower.startsWith("is there") || lower.startsWith("how much")) {
            const matchedItem = pantry.find(item => {
              const name = item.name.toLowerCase();
              const short = (item.shortName || "").toLowerCase();
              return lower.includes(name) || lower.includes(short) || name.split(" ").some(w => w.length > 3 && lower.includes(w));
            });

            if (matchedItem) {
              const isLow = matchedItem.current <= matchedItem.threshold;
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: `✅ **${matchedItem.name}** is in your kitchen:\n• **Stock**: ${matchedItem.current} ${matchedItem.unit} (Threshold: ${matchedItem.threshold} ${matchedItem.unit})\n• **Freshness**: ~${matchedItem.daysExpiry || 30} days shelf-life\n• **Status**: ${isLow ? '🚨 Low stock alert!' : '🟢 Sufficient'}`,
                  suggestions: [`What can I cook with ${matchedItem.shortName}?`, "Show pantry list"]
                }
              ]);
            } else {
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: `❌ I checked your pantry list and could not find that item. Would you like to add it?`,
                  suggestions: ["What is present in my pantry list?", "What can I cook?"]
                }
              ]);
            }
            return;
          }

          // 4. RECIPE SUGGESTIONS
          if (lower.includes("what can i cook") || lower.includes("suggest") || lower.includes("recipe") || lower.includes("dinner")) {
            const rankedRecipes = INDIAN_RECIPES.map(recipe => {
              let matchedCount = 0;
              recipe.ingredients.forEach(ing => {
                const found = pantry.find(p => {
                  const pName = p.name.toLowerCase();
                  const pShort = (p.shortName || "").toLowerCase();
                  const ingName = ing.name.toLowerCase();
                  return pName.includes(ingName) || ingName.includes(pName) || pShort.includes(ingName) || ingName.includes(pShort);
                });
                if (found && found.current > 0) matchedCount++;
              });
              const matchPct = Math.round((matchedCount / recipe.ingredients.length) * 100);
              return { ...recipe, matchPct, matchedCount, totalCount: recipe.ingredients.length, reason: `${matchedCount}/${recipe.ingredients.length} ingredients ready (${matchPct}% match)` };
            }).sort((a, b) => b.matchPct - a.matchPct);

            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: `Based on your live kitchen inventory, here are top recipe recommendations for ${totalMealEaters} portions:`,
                dishRecommendations: rankedRecipes.slice(0, 3),
                suggestions: ["What is in my pantry?", "Which items are expiring soon?"]
              }
            ]);
            return;
          }

          // DEFAULT FALLBACK
          setChatMessages(prev => [
            ...prev,
            {
              id: "ai-" + Date.now(),
              sender: "ai",
              text: `Namaste! I am tracking all **${pantry.length} items** in your kitchen. You can ask *"What is in my pantry?"*, *"What can I cook?"*, or speak using the microphone button!`,
              suggestions: ["What is present in my pantry list?", "What can I cook?", "Which items are expiring soon?"]
            }
          ]);
        }, 400);
      };

      const filteredItems = useMemo(() => {
        return pantry.filter(item => {
          const matchesCategory = selectedCategory === "All Items" || item.category === selectedCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.shortName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [pantry, selectedCategory, searchQuery]);

      return (
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          
          {/* TOAST ALERT */}
          {toast && (
            <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-orange-500/40 text-xs font-bold flex items-center gap-2 animate-bounce">
              <Icons.Sparkles />
              <span>{toast}</span>
            </div>
          )}

          {/* APP HEADER */}
          <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 pb-6 border-b border-orange-200/70 mb-6">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 to-orange-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/25">
                <Icons.Home />
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-2xl font-black bg-gradient-to-r from-amber-950 to-orange-700 bg-clip-text text-transparent">
                    DearHome
                  </h1>
                  <span class="text-[10px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md">
                    SDG 12: Zero Waste Engine
                  </span>
                </div>
                <p class="text-xs text-slate-500 font-medium">Smart Indian Kitchen Inventory, Bill Ingestion & Meal Depletion</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button
                onClick={() => setActiveTab("ledger")}
                class="px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-800 font-bold text-xs shadow-sm transition-all flex items-center gap-1.5"
              >
                <Icons.List />
                <span>Kitchen Ledger</span>
              </button>

              <button
                onClick={() => setActiveTab("scan")}
                class="px-3.5 py-2.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-xs shadow-md shadow-orange-500/20 transition-all flex items-center gap-1.5"
              >
                <Icons.Camera />
                <span>Scan Grocery Bill</span>
              </button>
            </div>
          </header>

          {/* NAVIGATION BAR */}
          <nav class="flex gap-2 p-1.5 bg-slate-100/90 rounded-2xl mb-8 overflow-x-auto border border-slate-200/80">
            {[
              { id: "scan", label: "Bill OCR Scanner", icon: <Icons.Camera /> },
              { id: "assistant", label: "Voice & AI Assistant", icon: <Icons.Chat /> },
              { id: "pantry", label: "Digital Pantry", count: pantry.length, icon: <Icons.Box /> },
              { id: "family", label: "Family & Guest Scaler", icon: <Icons.Users /> },
              { id: "cook", label: "Cook & Deplete", icon: <Icons.Flame /> },
              { id: "ledger", label: "Kitchen Ledger", count: ledgerEvents.length, icon: <Icons.List /> },
              { id: "radar", label: "Restock Radar", count: lowStockItems.length, alert: lowStockItems.length > 0, icon: <Icons.Alert /> }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                class={"flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs whitespace-nowrap transition-all " + (
                  activeTab === tab.id
                    ? "bg-white text-orange-800 shadow-sm border border-orange-200/80"
                    : "text-slate-600 hover:text-slate-950 hover:bg-white/50"
                )}
              >
                {tab.icon}
                <span>{tab.label}</span>
                {tab.count !== undefined && tab.count > 0 && (
                  <span class={"text-[10px] px-1.5 py-0.2 rounded-full font-black " + (
                    tab.alert ? "bg-red-500 text-white animate-pulse" : "bg-slate-200 text-slate-700"
                  )}>
                    {tab.count}
                  </span>
                )}
              </button>
            ))}
          </nav>

          {/* TAB: BILL OCR SCANNER */}
          {activeTab === "scan" && (
            <div class="max-w-4xl mx-auto space-y-6">
              <div class="bg-gradient-to-r from-orange-600 via-amber-600 to-orange-700 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div>
                  <span class="text-[10px] font-black uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">
                    Multimodal Invoice Parser
                  </span>
                  <h2 class="text-2xl font-black mt-2">Delivery Bill & Receipt Scanner</h2>
                  <p class="text-xs text-orange-100 mt-1 max-w-xl">
                    Extracts items, weights (kg, g, L), and rates from Zepto, Blinkit, Swiggy, Amazon Fresh, and supermarket receipts.
                  </p>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center text-white text-2xl border border-white/20 shrink-0">
                  <Icons.Camera />
                </div>
              </div>

              {/* FILE DRAG & DROP ZONE */}
              <div class="bg-white rounded-3xl p-6 border-2 border-dashed border-orange-300 hover:border-orange-500 transition-all text-center space-y-3">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center">
                  <Icons.Upload />
                </div>
                <div>
                  <h4 class="font-black text-sm text-slate-900">Upload Receipt Photo or PDF Bill</h4>
                  <p class="text-xs text-slate-500 mt-0.5">Drag and drop or browse to scan Zepto, Blinkit, D-Mart or paper bills</p>
                </div>
                <div>
                  <label class="inline-flex items-center gap-1.5 px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl cursor-pointer shadow-md shadow-orange-500/20 transition-all">
                    <Icons.Camera />
                    <span>Browse Bill Photo / PDF</span>
                    <input
                      type="file"
                      accept="image/*,application/pdf"
                      class="hidden"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          setCustomUploadedFile(file.name);
                          setIsScanning(true);
                          showToast("Scanning receipt with Gemini OCR...");
                          setTimeout(() => {
                            setIsScanning(false);
                            const parsedSample = {
                              id: "inv-custom-" + Date.now(),
                              platform: "Scanned Receipt (" + file.name.substring(0, 15) + ")",
                              badgeColor: "bg-emerald-100 text-emerald-800 border-emerald-300",
                              orderId: "#SCAN-" + Math.floor(1000 + Math.random() * 9000),
                              time: "Just now (OCR Extracted)",
                              totalAmount: "₹620",
                              items: [
                                { name: "Aashirvaad Shudh Chakki Atta (5kg)", shortName: "Chakki Atta", qty: 5, unit: "kg", rate: "₹240", category: "Atta and Grains" },
                                { name: "Amul Taaza Toned Milk (2L)", shortName: "Amul Milk", qty: 2, unit: "L", rate: "₹112", category: "Dairy and Fresh" },
                                { name: "Tata Sampann Toor Dal (1kg)", shortName: "Toor Dal", qty: 1, unit: "kg", rate: "₹175", category: "Dals and Pulses" },
                                { name: "Fresh Country Tomatoes (1kg)", shortName: "Tomato (Tamatar)", qty: 1, unit: "kg", rate: "₹35", category: "Vegetables" }
                              ]
                            };
                            setSelectedInvoice(parsedSample);
                            setScanResult(parsedSample);
                            showToast("Extracted items successfully!");
                          }, 800);
                        }
                      }}
                    />
                  </label>
                  {customUploadedFile && (
                    <span class="block text-xs font-bold text-emerald-600 mt-2">
                      ✅ Loaded: {customUploadedFile}
                    </span>
                  )}
                </div>
              </div>

              {/* ACTIVE INVOICE DETAILS & INGESTION BUTTON */}
              <div class="bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-md space-y-6">
                <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div>
                    <h3 class="text-lg font-black text-slate-900">{scanResult.platform}</h3>
                    <span class="text-xs text-slate-500 block mt-0.5">{scanResult.time}</span>
                  </div>
                  <button
                    onClick={() => handleIngestInvoiceItems(scanResult.items, scanResult.platform)}
                    class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-2xl shadow-lg shadow-emerald-600/25 flex items-center gap-1.5 transition-all"
                  >
                    <Icons.Check />
                    <span>Ingest All Items into Live Pantry</span>
                  </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {scanResult.items.map((item, idx) => (
                    <div key={idx} class="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center text-xs font-bold">
                      <div>
                        <span class="text-slate-900 block">{item.name}</span>
                        <span class="text-slate-400 text-[10px]">{item.category}</span>
                      </div>
                      <span class="text-orange-600 font-black">{item.qty} {item.unit}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB: VOICE & AI KITCHEN ASSISTANT */}
          {activeTab === "assistant" && (
            <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-xl space-y-6">
              <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-2xl bg-orange-500 text-white flex items-center justify-center font-black">
                    <Icons.Chat />
                  </div>
                  <div>
                    <h3 class="font-black text-base text-slate-900">DearHome AI Kitchen Assistant</h3>
                    <p class="text-xs text-slate-500">Pantry Aware • Voice Enabled • Recipe Recommendations</p>
                  </div>
                </div>
                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
                  {pantry.length} items in memory
                </span>
              </div>

              {/* CHAT MESSAGES */}
              <div class="h-96 overflow-y-auto space-y-4 pr-2">
                {chatMessages.map(msg => (
                  <div key={msg.id} class={"flex flex-col " + (msg.sender === "user" ? "items-end" : "items-start")}>
                    <div class={"max-w-xl p-4 rounded-3xl text-xs leading-relaxed " + (
                      msg.sender === "user"
                        ? "bg-slate-900 text-white rounded-tr-sm"
                        : "bg-orange-50/80 text-slate-800 border border-orange-200/70 rounded-tl-sm"
                    )}>
                      <p class="whitespace-pre-line">{msg.text}</p>
                    </div>

                    {msg.dishRecommendations && (
                      <div class="mt-3 space-y-2 w-full max-w-xl">
                        {msg.dishRecommendations.map((rec, idx) => (
                          <div key={idx} class="p-3 bg-white rounded-2xl border border-orange-200 shadow-sm flex items-center justify-between text-xs font-bold">
                            <div>
                              <span class="text-slate-900 block font-extrabold">{rec.name}</span>
                              <span class="text-[10px] text-emerald-600 block">{rec.reason}</span>
                            </div>
                            <button
                              onClick={() => handleCookMealDirect(rec.id, totalMealEaters)}
                              class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-[11px] font-bold"
                            >
                              Cooked This ({totalMealEaters}p)
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    {msg.suggestions && (
                      <div class="flex flex-wrap gap-1.5 mt-2">
                        {msg.suggestions.map((sug, sIdx) => (
                          <button
                            key={sIdx}
                            onClick={() => handleSendMessage(sug)}
                            class="text-[10px] bg-slate-100 hover:bg-orange-100 text-slate-600 px-2.5 py-1 rounded-full font-bold transition-all border border-slate-200"
                          >
                            {sug}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
                {isAiThinking && (
                  <div class="flex items-center gap-2 p-3 bg-orange-50 rounded-2xl max-w-xs text-xs text-orange-800 font-semibold animate-pulse">
                    <Icons.Sparkles />
                    <span>Consulting kitchen memory...</span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* INPUT BAR WITH VOICE MIC */}
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSendMessage();
                }}
                class="flex gap-2"
              >
                <button
                  type="button"
                  onClick={startVoiceRecognition}
                  class={"px-4 py-3.5 rounded-2xl border font-bold text-xs shadow-sm flex items-center gap-1.5 transition-all " + (
                    isListening 
                      ? "bg-red-500 text-white border-red-600 pulse-mic" 
                      : "bg-white hover:bg-orange-50 text-slate-700 border-slate-200"
                  )}
                  title="Speak to Assistant"
                >
                  {isListening ? <Icons.MicActive /> : <Icons.Mic />}
                  <span class="hidden sm:inline">{isListening ? "Listening..." : "Voice"}</span>
                </button>

                <input
                  type="text"
                  placeholder={isListening ? "🎙️ Listening... speak now..." : "Ask e.g. 'What is in my pantry?' or 'What can I cook?'..."}
                  value={userChatInput}
                  onChange={(e) => setUserChatInput(e.target.value)}
                  class="flex-1 px-4 py-3.5 bg-white border border-slate-200 rounded-2xl text-xs font-semibold focus:outline-none focus:border-orange-500 shadow-sm"
                />

                <button
                  type="submit"
                  class="px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-2xl shadow-md flex items-center gap-2"
                >
                  <Icons.Send />
                  <span>Send</span>
                </button>
              </form>
            </div>
          )}

          {/* TAB: DIGITAL PANTRY */}
          {activeTab === "pantry" && (
            <div class="space-y-6">
              <div class="bg-white rounded-3xl p-5 border border-orange-100 shadow-sm space-y-4">
                <input
                  type="text"
                  placeholder="Search Atta, Bread, Tomatoes, Toor Dal, Mustard Oil, Haldi, Amul Milk..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold focus:outline-none focus:border-orange-500"
                />

                <div class="flex overflow-x-auto gap-2 pb-1">
                  {CATEGORIES.map(category => (
                    <button
                      key={category}
                      onClick={() => setSelectedCategory(category)}
                      class={"px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all " + (
                        selectedCategory === category
                          ? "bg-orange-500 text-white shadow-md shadow-orange-500/20"
                          : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                      )}
                    >
                      {category}
                    </button>
                  ))}
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filteredItems.map(item => {
                  const pct = Math.min(100, Math.round((item.current / item.max) * 100));
                  const isLow = item.current <= item.threshold;
                  const isExpiring = (item.daysExpiry || 99) <= 3;

                  return (
                    <div
                      key={item.id}
                      class={"rounded-3xl p-5 border transition-all duration-300 hover:shadow-lg " + (
                        isLow ? "bg-red-50/80 border-red-200" : isExpiring ? "bg-amber-50/70 border-amber-300" : "bg-white border-orange-100"
                      )}
                    >
                      <div class="flex items-start justify-between">
                        <div>
                          <span class="text-[10px] font-bold text-slate-400 uppercase block">{item.category}</span>
                          <h3 class="font-bold text-sm text-slate-900 leading-tight">{item.shortName}</h3>
                        </div>
                        <span class={"text-xs font-black px-2 py-0.5 rounded-lg " + (
                          isLow ? "bg-red-100 text-red-700" : isExpiring ? "bg-amber-200 text-amber-900" : "bg-emerald-100 text-emerald-800"
                        )}>
                          {item.current} {item.unit}
                        </span>
                      </div>

                      {/* EXPIRY & RUNOUT BADGE */}
                      <div class="mt-2 flex items-center justify-between text-[10px] font-bold">
                        <span class={isExpiring ? "text-amber-700 bg-amber-100 px-2 py-0.5 rounded-md" : "text-slate-500"}>
                          ⏳ {item.daysExpiry ? `Shelf-life: ~${item.daysExpiry}d` : "Fresh"}
                        </span>
                        <span class="text-slate-400">Threshold: &le;{item.threshold} {item.unit}</span>
                      </div>

                      <div class="mt-3">
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                          <div
                            class={"h-full rounded-full transition-all duration-500 " + (
                              isLow ? "bg-red-500" : pct < 50 ? "bg-amber-500" : "bg-emerald-500"
                            )}
                            style={{ width: pct + "%" }}
                          ></div>
                        </div>
                      </div>

                      <div class="mt-3 grid grid-cols-2 gap-2">
                        <button
                          onClick={() => updateStock(item.id, item.unit === "g" ? -20 : -0.5)}
                          class="py-1 bg-slate-100 hover:bg-red-100 hover:text-red-700 text-slate-700 rounded-xl text-xs font-bold"
                        >
                          - {item.unit === "g" ? "20g" : "0.5" + item.unit}
                        </button>
                        <button
                          onClick={() => updateStock(item.id, item.unit === "g" ? 50 : 1.0)}
                          class="py-1 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 text-slate-700 rounded-xl text-xs font-bold"
                        >
                          + {item.unit === "g" ? "50g" : "1" + item.unit}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB: FAMILY & GUEST SCALER */}
          {activeTab === "family" && (
            <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-xl space-y-6">
              <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                  <h3 class="font-black text-xl text-slate-900">Family Profile & Guest Scaler</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Calculates exact ingredient weights based on diners & appetite</p>
                </div>
                <div class="p-3 bg-orange-50 rounded-2xl border border-orange-200 text-center">
                  <span class="text-[10px] font-bold text-slate-500 uppercase block">Effective Diners</span>
                  <span class="text-xl font-black text-orange-600">{totalMealEaters} portions</span>
                </div>
              </div>

              <div class="space-y-4">
                <div class="grid grid-cols-3 gap-3">
                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                    <span class="text-xs font-bold text-slate-600 block">Adults (1.0x)</span>
                    <div class="flex items-center justify-center gap-2 mt-2">
                      <button onClick={() => setHousehold(p => ({ ...p, adults: Math.max(1, p.adults - 1) }))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">-</button>
                      <span class="text-base font-black">{household.adults}</span>
                      <button onClick={() => setHousehold(p => ({ ...p, adults: p.adults + 1 }))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">+</button>
                    </div>
                  </div>

                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                    <span class="text-xs font-bold text-slate-600 block">Children (0.6x)</span>
                    <div class="flex items-center justify-center gap-2 mt-2">
                      <button onClick={() => setHousehold(p => ({ ...p, children: Math.max(0, p.children - 1) }))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">-</button>
                      <span class="text-base font-black">{household.children}</span>
                      <button onClick={() => setHousehold(p => ({ ...p, children: p.children + 1 }))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">+</button>
                    </div>
                  </div>

                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                    <span class="text-xs font-bold text-slate-600 block">Visiting Guests (1.0x)</span>
                    <div class="flex items-center justify-center gap-2 mt-2">
                      <button onClick={() => setGuestCountForMeal(g => Math.max(0, g - 1))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">-</button>
                      <span class="text-base font-black text-orange-600">{guestCountForMeal}</span>
                      <button onClick={() => setGuestCountForMeal(g => g + 1)} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">+</button>
                    </div>
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Appetite Multiplier</label>
                  <div class="grid grid-cols-3 gap-2">
                    {["Light (0.75x)", "Regular (1.0x)", "Hearty (1.3x)"].map(app => (
                      <button
                        key={app}
                        onClick={() => setHousehold({ ...household, appetiteLevel: app })}
                        class={"p-3 rounded-2xl border font-bold text-xs transition-all " + (
                          household.appetiteLevel === app ? "bg-orange-500 text-white border-orange-600 shadow-md" : "bg-slate-50 border-slate-200 text-slate-700"
                        )}
                      >
                        {app}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB: COOK & DEPLETE (RECIPES) */}
          {activeTab === "cook" && (
            <div class="max-w-4xl mx-auto space-y-6">
              <div class="flex justify-between items-center bg-white rounded-3xl p-5 border border-orange-100 shadow-sm">
                <div>
                  <h3 class="font-black text-lg text-slate-900">Cook a Recipe & Auto-Deduct Inventory</h3>
                  <p class="text-xs text-slate-500">Scaling for {totalMealEaters} effective portions</p>
                </div>
                <button
                  onClick={() => setActiveTab("family")}
                  class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-xl hover:bg-orange-100"
                >
                  Adjust Diners ({totalMealEaters}p)
                </button>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {INDIAN_RECIPES.map(recipe => (
                  <div key={recipe.id} class="bg-white rounded-3xl p-6 border border-orange-100 shadow-sm space-y-4">
                    <div class="flex justify-between items-start">
                      <div>
                        <span class="text-[10px] font-black uppercase text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">{recipe.cuisine}</span>
                        <h4 class="font-extrabold text-base text-slate-900 mt-1">{recipe.name}</h4>
                        <span class="text-xs text-slate-500">⏱️ {recipe.prepTime}</span>
                      </div>
                      <a
                        href={"https://www.youtube.com/results?search_query=" + encodeURIComponent(recipe.youtubeQuery)}
                        target="_blank"
                        rel="noopener noreferrer"
                        class="p-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100"
                        title="Watch Recipe Video"
                      >
                        <Icons.Video />
                      </a>
                    </div>

                    <div class="space-y-1.5 pt-2 border-t border-slate-100 text-xs">
                      {recipe.ingredients.map((ing, idx) => (
                        <div key={idx} class="flex justify-between text-slate-600">
                          <span>• {ing.name}</span>
                          <span class="font-bold">{(ing.qty * totalMealEaters).toFixed(1)} {ing.unit}</span>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => handleCookMealDirect(recipe.id, totalMealEaters)}
                      class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-black text-xs rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all"
                    >
                      <Icons.Flame />
                      <span>Cook This Meal ({totalMealEaters} Portions)</span>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB: UNIFIED KITCHEN LEDGER & HISTORY */}
          {activeTab === "ledger" && (
            <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-xl space-y-6">
              <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                  <h3 class="font-black text-xl text-slate-900">Kitchen Activity Ledger</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Chronological audit of all additions (credits) and meal depletions (debits)</p>
                </div>
                <span class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-xl">
                  {ledgerEvents.length} Events Logged
                </span>
              </div>

              {ledgerEvents.length === 0 ? (
                <div class="text-center py-12 text-slate-400 text-xs font-bold">
                  No kitchen events recorded yet. Ingest a bill or cook a meal to see logs!
                </div>
              ) : (
                <div class="space-y-3">
                  {ledgerEvents.map(event => (
                    <div
                      key={event.id}
                      class={"p-4 rounded-2xl border flex items-center justify-between transition-all " + (
                        event.type === "CREDIT" ? "bg-emerald-50/70 border-emerald-200" : "bg-orange-50/70 border-orange-200"
                      )}
                    >
                      <div class="flex items-center gap-3">
                        <div class={"w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm " + (
                          event.type === "CREDIT" ? "bg-emerald-200 text-emerald-900" : "bg-orange-200 text-orange-900"
                        )}>
                          {event.type === "CREDIT" ? "+" : "-"}
                        </div>
                        <div>
                          <div class="flex items-center gap-2">
                            <h4 class="font-black text-sm text-slate-900">{event.title}</h4>
                            <span class="text-[10px] text-slate-400 font-semibold">{event.time}</span>
                          </div>
                          <p class="text-xs text-slate-600 mt-0.5">{event.subtitle}</p>
                        </div>
                      </div>

                      <div class="flex items-center gap-3">
                        <span class={"text-xs font-black px-2.5 py-1 rounded-lg " + (
                          event.type === "CREDIT" ? "bg-emerald-200 text-emerald-900" : "bg-orange-200 text-orange-900"
                        )}>
                          {event.amount}
                        </span>

                        {event.logId && (
                          <button
                            onClick={() => handleUndoMeal(event.logId)}
                            class="px-2.5 py-1 bg-white hover:bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm transition-all"
                            title="Undo meal and restore pantry stock"
                          >
                            <Icons.Undo />
                            <span>Undo</span>
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* TAB: RESTOCK RADAR */}
          {activeTab === "radar" && (
            <div class="max-w-3xl mx-auto space-y-6">
              <div class="bg-red-500 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center">
                <div>
                  <h3 class="font-black text-2xl">Restock Radar</h3>
                  <p class="text-xs text-red-100 mt-1">Items currently below their safety thresholds</p>
                </div>
                <div class="text-3xl font-black">{lowStockItems.length}</div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {lowStockItems.map(item => (
                  <div key={item.id} class="bg-white rounded-3xl p-5 border border-red-200 shadow-sm flex justify-between items-center">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900">{item.shortName}</h4>
                      <span class="text-xs text-red-600 font-bold">Only {item.current} {item.unit} left</span>
                    </div>
                    <button
                      onClick={() => updateStock(item.id, item.unit === "g" ? 250 : 2.0)}
                      class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold"
                    >
                      + Restock
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
