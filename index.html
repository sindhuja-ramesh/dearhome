      // In-Browser Canvas Image Preprocessor for Crisp Thermal OCR
      const preprocessImageForOcr = (dataUrl) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 2200;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              const ratio = Math.min(maxDim / w, maxDim / h);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            } else if (w < 900) {
              const ratio = 1200 / w;
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);

            // Grayscale + Adaptive Contrast Stretch
            try {
              const imgData = ctx.getImageData(0, 0, w, h);
              const d = imgData.data;
              let minLum = 255;
              let maxLum = 0;
              for (let i = 0; i < d.length; i += 4) {
                const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                if (lum < minLum) minLum = lum;
                if (lum > maxLum) maxLum = lum;
              }

              const range = Math.max(1, maxLum - minLum);
              for (let i = 0; i < d.length; i += 4) {
                let lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                lum = ((lum - minLum) / range) * 255;
                if (lum < 115) lum = lum * 0.75; // Darken faint text
                else if (lum > 135) lum = Math.min(255, lum * 1.15 + 15); // Whiten paper
                d[i] = lum;
                d[i+1] = lum;
                d[i+2] = lum;
              }
              ctx.putImageData(imgData, 0, 0);
              resolve(canvas.toDataURL("image/jpeg", 0.95));
            } catch (e) {
              resolve(dataUrl);
            }
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        });
      };

      // Advanced Indian Grocery Line-Item & Layout Parser
      const parseRawTextToGroceryItems = (fullText) => {
        if (!fullText || !fullText.trim()) return [];
        const rawLines = fullText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

        const noiseHeaderRegex = /^(store|retail|mart|provision|superfast|order|delivered|date|time|gst|fssai|lic|tax|cash|phone|ph:|tel:|welcome|invoice|receipt|item description|sl no|sno|description)/i;
        const noiseFooterRegex = /^(subtotal|sub total|grand total|net total|item total|total amount|total items|total|net amount|amount payable|round off|balance|paid|cash received|change|savings|discount|delivery fee|handling|bag fee|cgst|sgst|igst|vat|taxable|thank you|visit again|powered by)/i;

        const items = [];
        let bufferName = "";

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          const lower = line.toLowerCase();

          // Skip divider lines
          if (/^[-=*_#.|/\\~\s]{3,}$/.test(line)) continue;
          if (noiseFooterRegex.test(lower)) continue;

          // Check if whole line is store header / metadata
          if (noiseHeaderRegex.test(lower) && !/\d+\s*(?:kg|g|l|ml|pkt|pack|rs|₹)/i.test(line) && !/\d+\.\d{2}/.test(line)) {
            bufferName = "";
            continue;
          }

          // Strip leading item numbers like "1.", "1)", "1 ", "| 1 "
          let cleanLine = line
            .replace(/^\|\s*|\s*\|$/g, '')
            .replace(/^\s*\d+[\.\)\-\s]\s*/, '')
            .trim();

          // Skip column headers
          if (/^(item|description|qty|price|rate|amount|sl no|sno)$/i.test(cleanLine.toLowerCase()) ||
              /^(item description|qty price|rate amount|items count)$/i.test(cleanLine.toLowerCase())) {
            bufferName = "";
            continue;
          }

          // Extract price: matches "₹240", "Rs. 112", "45.00", "Rs 971" at line end
          const priceMatch = cleanLine.match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d{2})?)(?:\s*$)/i);
          let rate = "₹50";
          if (priceMatch) {
            const pNum = parseFloat(priceMatch[1]);
            if (pNum > 5) rate = "₹" + Math.round(pNum);
          }

          // Extract weight/volume pack size (e.g., "5kg", "500g", "1 L", "250ml", "100g")
          const weightMatch = cleanLine.match(/(\d+(?:\.\d+)?)\s*(kg|kgs|g|gm|gms|gram|grams|l|ltr|ltrs|liter|liters|litre|litres|ml|pkt|pkts|packets?|packs?|pcs|pieces?)\b/i);

          // Extract count quantity (e.g., "x 2", "2 nos", or number before price column "1   245.00")
          const countMatch = cleanLine.match(/(?:\bx\s*(\d+)\b)|(?:\b(\d+)\s*(?:nos|no|qty|units?)\b)|(?:\s+(\d+)\s+(?:(?:₹|rs\.?|inr)?\s*\d+(?:\.\d{2})?)\s*$)/i);

          let count = 1;
          if (countMatch) {
            count = parseInt(countMatch[1] || countMatch[2] || countMatch[3], 10) || 1;
          }

          let qty = count;
          let unit = "pcs";

          if (weightMatch) {
            const baseNum = parseFloat(weightMatch[1]) || 1;
            const u = (weightMatch[2] || "").toLowerCase();
            
            let stdUnit = "pcs";
            if (u.startsWith("kg")) stdUnit = "kg";
            else if (u.startsWith("g") || u.startsWith("gm")) stdUnit = "g";
            else if (u.startsWith("l") || u.startsWith("ltr")) stdUnit = "L";
            else if (u.startsWith("ml")) stdUnit = "ml";
            else if (u.startsWith("pkt") || u.startsWith("pack")) stdUnit = "packets";
            else stdUnit = "pcs";

            qty = count > 1 ? (baseNum * count) : baseNum;
            unit = stdUnit;
          }

          // Clean product name
          let cleanName = cleanLine
            .replace(/(?:₹|rs\.?|inr)?\s*\d+(?:\.\d{2})?\s*$/i, '')
            .replace(/\bx\s*\d+\b/gi, '')
            .replace(/\s+\d+\s*$/i, '')
            .replace(/(\d+(?:\.\d+)?)\s*(kg|kgs|g|gm|gms|gram|grams|l|ltr|ltrs|liter|liters|litre|litres|ml|pkt|pkts|packets?|packs?|pcs|pieces?)\b/gi, '')
            .replace(/[()\-–—]/g, ' ')
            .replace(/[^a-zA-Z0-9\s&']/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const skipKeywords = ['item', 'items', 'description', 'qty', 'rate', 'price', 'amount', 'mrp', 'hsn', 'code', 'sno', 'sl no'];
          if (skipKeywords.includes(cleanName.toLowerCase())) continue;

          if (cleanName.length > 0) {
            if (!priceMatch && !weightMatch && !countMatch && cleanName.length > 2) {
              bufferName = bufferName ? (bufferName + " " + cleanName) : cleanName;
            } else {
              const fullName = bufferName ? (bufferName + " " + cleanName).trim() : cleanName;
              bufferName = "";

              if (fullName.length >= 2) {
                let category = "Vegetables";
                const lName = fullName.toLowerCase();

                if (/\b(haldi|turmeric|jeera|cumin|mirch|chilli|masala|rai|mustard seed|hing|asafoetida|spice|spices|salt|namak|sugar|cheeni|tea|chai|coffee|elaichi|cardamom|clove|laung|cinnamon|dalchini|coriander powder|dhania|everest|mdh|catch)\b/i.test(lName)) {
                  category = "Spices and Condiments";
                } else if (/\b(milk|curd|dahi|paneer|butter|cheese|cream|ghee|egg|eggs|yogurt|lassi|chaas|nandini|amul|mother dairy)\b/i.test(lName)) {
                  category = "Dairy and Fresh";
                } else if (/\b(atta|flour|rice|poha|wheat|grain|maida|suji|sooji|rava|besan|oats|quinoa|millets|ragi|sona masoori|basmati|chakki)\b/i.test(lName)) {
                  category = "Atta and Grains";
                } else if (/\b(dal|dhal|pulse|pulses|rajma|chana|moong|toor|urad|arhar|masoor|kabuli|lobia|gram)\b/i.test(lName)) {
                  category = "Dals and Pulses";
                } else if (/\b(oil|sunflower|mustard oil|groundnut|gingelly|olive oil|coconut oil|saffola|fortune|gemini)\b/i.test(lName)) {
                  category = "Oils and Ghee";
                } else if (/\b(bread|biscuit|biscuits|snack|snacks|cookie|rusk|toast|chips|namkeen|sauce|ketchup|jam|noodle|noodles|pasta|maggi|soup|yippee)\b/i.test(lName)) {
                  category = "Beverages and Snacks";
                } else if (/\b(tomato|tomatoes|onion|onions|potato|potatoes|ginger|garlic|chilli|coriander|lemon|carrot|cucumber|capsicum|brinjal|bhindi|cabbage|cauliflower|palak|spinach|beans|peas|matar|methi)\b/i.test(lName)) {
                  category = "Vegetables";
                }

                const formattedName = fullName
                  .split(' ')
                  .filter(w => w.length > 0)
                  .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                  .join(' ');

                items.push({
                  name: formattedName,
                  shortName: formattedName.split(' ').slice(0, 2).join(' '),
                  qty: qty,
                  unit: unit,
                  rate: rate,
                  category: category
                });
              }
            }
          }
        }

        return items;
      };

      // Engine 1: Google Gemini Multimodal Vision API (Gemini 1.5 / 2.0 Flash)
      const parseWithGeminiVision = async (base64Data, mimeType) => {
        const apiKey = geminiApiKey.trim() || localStorage.getItem("dearhome_gemini_key") || "";
        if (!apiKey) return null;

        const prompt = "You are an expert OCR receipt parsing AI for Indian households. Analyze this grocery receipt or delivery invoice image. " +
          "Extract all real physical grocery items. Ignore taxes, delivery charges, discounts, and payment methods. " +
          "Return a STRICT JSON array of objects with NO markdown formatting: " +
          "name (full item name), shortName (1-2 word staple name), qty (number only e.g. 5, 1, 0.5), " +
          "unit (one of: 'kg', 'g', 'L', 'ml', 'packets', 'pcs'), rate (price e.g. '₹240'), " +
          "category (one of: 'Atta and Grains', 'Dals and Pulses', 'Oils and Ghee', 'Dairy and Fresh', 'Vegetables', 'Beverages and Snacks', 'Spices and Condiments').";

        const rawBase64 = base64Data.split(',')[1] || base64Data;
        const cleanMime = mimeType || 'image/jpeg';

        const requestBody = {
          contents: [{
            parts: [
              { text: prompt },
              {
                inlineData: {
                  mimeType: cleanMime,
                  data: rawBase64
                }
              }
            ]
          }],
          generationConfig: {
            temperature: 0.1,
            maxOutputTokens: 2048,
            responseMimeType: "application/json"
          }
        };

        const endpoints = [
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`
        ];

        let lastErr = null;
        for (const endpoint of endpoints) {
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(requestBody)
            });

            if (response.ok) {
              const resultData = await response.json();
              const rawResponseText = resultData.candidates?.[0]?.content?.parts?.[0]?.text || "";
              const cleanJson = rawResponseText.replace(/```json/gi, '').replace(/```/g, '').trim();
              const items = JSON.parse(cleanJson);
              if (Array.isArray(items) && items.length > 0) {
                return items;
              }
            } else {
              const errTxt = await response.text();
              lastErr = new Error(`Gemini API HTTP ${response.status}: ${errTxt}`);
            }
          } catch (e) {
            lastErr = e;
          }
        }

        if (lastErr) throw lastErr;
        return null;
      };

      // Engine 2: Canvas-Preprocessed Tesseract.js In-Browser OCR
      const parseWithTesseractOcr = async (imageSrc) => {
        if (typeof Tesseract === "undefined") {
          throw new Error("Tesseract.js OCR engine is still loading from CDN, please wait 2 seconds.");
        }
        setOcrProcessingStep("✨ Enhancing receipt contrast and sharpening text...");
        const enhancedImage = await preprocessImageForOcr(imageSrc);

        setOcrProcessingStep("📸 Reading receipt text directly from image pixels...");
        const result = await Tesseract.recognize(enhancedImage, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              setOcrProcessingStep(`Recognizing bill text: ${Math.round((m.progress || 0) * 100)}%`);
            }
          }
        });

        const extractedText = result.data?.text || "";
        setRawOcrText(extractedText);
        return parseRawTextToGroceryItems(extractedText);
      };

      // Unified Receipt Processing Pipeline
      const processReceiptDataUrl = async (dataUrl, fileName, mimeType) => {
        setCustomUploadedFile(fileName);
        setUploadedImagePreview(dataUrl);
        setIsScanning(true);
        setRawOcrText("");
        setOcrProcessingStep("Analyzing your receipt photo...");

        let extractedItems = null;
        let engineUsed = "Google Gemini Multimodal Vision";

        // Step 1: Try Gemini Multimodal API if user provided an API key
        if (geminiApiKey.trim()) {
          try {
            setOcrProcessingStep("Sending image to Google Gemini Multimodal Vision...");
            extractedItems = await parseWithGeminiVision(dataUrl, mimeType);
            if (extractedItems && extractedItems.length > 0) {
              showToast("✨ Gemini AI recognized " + extractedItems.length + " items from your receipt!");
            }
          } catch (geminiErr) {
            console.warn("Gemini API notice, falling back to enhanced Tesseract OCR:", geminiErr);
            showToast("Gemini notice: " + geminiErr.message, "warning");
          }
        }

        // Step 2: In-Browser Visual Tesseract OCR with Contrast Enhancement
        if (!extractedItems || extractedItems.length === 0) {
          try {
            engineUsed = "In-Browser Visual OCR (Enhanced Tesseract)";
            extractedItems = await parseWithTesseractOcr(dataUrl);
            if (extractedItems && extractedItems.length > 0) {
              showToast("📸 In-browser OCR extracted " + extractedItems.length + " items from your photo!");
            }
          } catch (tessErr) {
            console.error("Tesseract OCR error:", tessErr);
          }
        }

        // Step 3: If completely unreadable
        if (!extractedItems || extractedItems.length === 0) {
          extractedItems = [
            { name: "Scanned Item (Edit details)", shortName: "Grocery Staple", qty: 1, unit: "kg", rate: "₹60", category: "Atta and Grains" },
            { name: "Dairy Item (Edit details)", shortName: "Milk", qty: 1, unit: "L", rate: "₹56", category: "Dairy and Fresh" }
          ];
          showToast("⚠️ Image text was faint. You can edit raw text or table items below.", "warning");
        }

        const newParsedInvoice = {
          id: "inv-upload-" + Date.now(),
          platform: "Scanned Bill: " + fileName + " (" + engineUsed + ")",
          badgeColor: "bg-emerald-100 text-emerald-900 border-emerald-300",
          orderId: "#SCAN-" + Math.floor(10000 + Math.random() * 90000),
          time: "Just now • " + engineUsed,
          totalAmount: extractedItems.length + " Items Extracted",
          items: extractedItems
        };

        setSelectedInvoice(newParsedInvoice);
        setScanResult(newParsedInvoice);
        setEditableScanItems(extractedItems);
        setIsScanning(false);
        setOcrProcessingStep("");
      };
    
      const handleIngestInvoiceItems = (items, platformName) => {
        let updatedPantry = [...pantry];
        let ingestedList = [];

        items.forEach((item, idx) => {
          const lowerName = (item.shortName || item.name).toLowerCase();
          let matchIndex = updatedPantry.findIndex(p =>
            p.shortName.toLowerCase() === lowerName ||
            p.name.toLowerCase().indexOf(lowerName) !== -1 ||
            lowerName.indexOf(p.shortName.toLowerCase()) !== -1
          );

          if (matchIndex !== -1) {
            const existing = updatedPantry[matchIndex];
            const newQty = +(existing.current + item.qty).toFixed(2);
            updatedPantry[matchIndex] = {
              ...existing,
              current: newQty,
              max: Math.max(existing.max, newQty * 1.2)
            };
            ingestedList.push({ name: existing.shortName, qty: "+" + item.qty + " " + item.unit });
          } else {
            const newItem = {
              id: "item-" + Date.now() + "-" + idx,
              name: item.name,
              shortName: item.shortName || item.name,
              category: item.category || "Beverages and Snacks",
              current: item.qty,
              max: item.qty * 1.5,
              unit: item.unit,
              threshold: Math.max(1, +(item.qty * 0.25).toFixed(1)),
              dailyBurn: 0.1,
              price: parseInt(item.rate?.replace(/[^\d]/g, '') || 50),
              daysExpiry: 14
            };
            updatedPantry = [newItem, ...updatedPantry];
            ingestedList.push({ name: newItem.shortName, qty: "+" + item.qty + " " + item.unit });

        setPantry(updatedPantry);

        showToast(`Ingested ${items.length} items from ${platformName}!`);
      };

      // CONVERSATIONAL AGENT MESSAGE HANDLER
      const handleSendMessage = (textToSend) => {

            let breakdown = Object.entries(categorized)

            setChatMessages(prev => [

          }

          // 2. EXPIRING SOON QUERY
          if (lower.includes("expir") || lower.includes("spoil") || lower.includes("waste")) {
            if (expiringItems.length === 0) {
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: "🌟 Great news! You have no critically expiring items in your kitchen right now.",
                  suggestions: ["What can I cook tonight?", "Show full pantry list"]
                }
              ]);
            } else {
              setChatMessages(prev => [
                ...prev,

                  sender: "ai",
                  text: `⏳ **Perishables Expiring within 3 Days (${expiringItems.length} items)**:\n\n` +
                    expiringItems.map(i => `• **${i.shortName}**: ${i.current} ${i.unit} (*Expires in ~${i.daysExpiry} days*)`).join("\n") +

                  suggestions: ["What can I cook with expiring items?", "Show pantry list"]

              ]);

            return;
          }

          // 3. SPECIFIC ITEM AVAILABILITY
          if (lower.startsWith("do i have") || lower.startsWith("is there") || lower.startsWith("how much")) {
            const matchedItem = pantry.find(item => {
              const name = item.name.toLowerCase();
              const short = (item.shortName || "").toLowerCase();
              return lower.includes(name) || lower.includes(short) || name.split(" ").some(w => w.length > 3 && lower.includes(w));
            });

            if (matchedItem) {
              const isLow = matchedItem.current <= matchedItem.threshold;
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: `✅ **${matchedItem.name}** is in your kitchen:\n• **Stock**: ${matchedItem.current} ${matchedItem.unit} (Threshold: ${matchedItem.threshold} ${matchedItem.unit})\n• **Freshness**: ~${matchedItem.daysExpiry || 30} days shelf-life\n• **Status**: ${isLow ? '🚨 Low stock alert!' : '🟢 Sufficient'}`,
                  suggestions: [`What can I cook with ${matchedItem.shortName}?`, "Show pantry list"]
                }
              ]);
            } else {
              setChatMessages(prev => [
                ...prev,
                {
                  id: "ai-" + Date.now(),
                  sender: "ai",
                  text: `❌ I checked your pantry list and could not find that item. Would you like to add it?`,
                  suggestions: ["What is present in my pantry list?", "What can I cook?"]
                }
              ]);
            }
            return;
          }

          // 4. RECIPE SUGGESTIONS
          if (lower.includes("what can i cook") || lower.includes("suggest") || lower.includes("recipe") || lower.includes("dinner")) {
            const rankedRecipes = INDIAN_RECIPES.map(recipe => {
              let matchedCount = 0;
              recipe.ingredients.forEach(ing => {
                const found = pantry.find(p => {
                  const pName = p.name.toLowerCase();
                  const pShort = (p.shortName || "").toLowerCase();
                  const ingName = ing.name.toLowerCase();
                  return pName.includes(ingName) || ingName.includes(pName) || pShort.includes(ingName) || ingName.includes(pShort);

              return { ...recipe, matchPct, matchedCount, totalCount: recipe.ingredients.length, reason: `${matchedCount}/${recipe.ingredients.length} ingredients ready (${matchPct}% match)` };

                sender: "ai",
                text: `Based on your live kitchen inventory, here are top recipe recommendations for ${totalMealEaters} portions:`,

              }

              sender: "ai",
              text: `Namaste! I am tracking all **${pantry.length} items** in your kitchen. You can ask *"What is in my pantry?"*, *"What can I cook?"*, or speak using the microphone button!`,
              suggestions: ["What is present in my pantry list?", "What can I cook?", "Which items are expiring soon?"]

                      <button onClick={() => setGuestCountForMeal(g => Math.max(0, g - 1))} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">-</button>
                      <span class="text-base font-black text-orange-600">{guestCountForMeal}</span>
                      <button onClick={() => setGuestCountForMeal(g => g + 1)} class="w-8 h-8 rounded-xl bg-white border border-slate-300 font-bold">+</button>
                    </div>
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Appetite Multiplier</label>
                  <div class="grid grid-cols-3 gap-2">
                    {["Light (0.75x)", "Regular (1.0x)", "Hearty (1.3x)"].map(app => (
                      <button
                        key={app}
                        onClick={() => setHousehold({ ...household, appetiteLevel: app })}
                        class={"p-3 rounded-2xl border font-bold text-xs transition-all " + (
                          household.appetiteLevel === app ? "bg-orange-500 text-white border-orange-600 shadow-md" : "bg-slate-50 border-slate-200 text-slate-700"
                        )}
                      >
                        {app}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB: COOK & DEPLETE (RECIPES) */}
          {activeTab === "cook" && (
            <div class="max-w-4xl mx-auto space-y-6">
              <div class="flex justify-between items-center bg-white rounded-3xl p-5 border border-orange-100 shadow-sm">
                <div>
                  <h3 class="font-black text-lg text-slate-900">Cook a Recipe & Auto-Deduct Inventory</h3>
                  <p class="text-xs text-slate-500">Scaling for {totalMealEaters} effective portions</p>
                </div>
                <button
                  onClick={() => setActiveTab("family")}
                  class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-xl hover:bg-orange-100"
                >
                  Adjust Diners ({totalMealEaters}p)
                </button>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {INDIAN_RECIPES.map(recipe => (
                  <div key={recipe.id} class="bg-white rounded-3xl p-6 border border-orange-100 shadow-sm space-y-4">
                    <div class="flex justify-between items-start">
                      <div>
                        <span class="text-[10px] font-black uppercase text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">{recipe.cuisine}</span>
                        <h4 class="font-extrabold text-base text-slate-900 mt-1">{recipe.name}</h4>
                        <span class="text-xs text-slate-500">⏱️ {recipe.prepTime}</span>
                      </div>
                      <a
                        href={"https://www.youtube.com/results?search_query=" + encodeURIComponent(recipe.youtubeQuery)}
                        target="_blank"
                        rel="noopener noreferrer"
                        class="p-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100"
                        title="Watch Recipe Video"
                      >
                        <Icons.Video />
                      </a>
                    </div>

                    <div class="space-y-1.5 pt-2 border-t border-slate-100 text-xs">
                      {recipe.ingredients.map((ing, idx) => (
                        <div key={idx} class="flex justify-between text-slate-600">
                          <span>• {ing.name}</span>
                          <span class="font-bold">{(ing.qty * totalMealEaters).toFixed(1)} {ing.unit}</span>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => handleCookMealDirect(recipe.id, totalMealEaters)}
                      class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-black text-xs rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all"
                    >
                      <Icons.Flame />
                      <span>Cook This Meal ({totalMealEaters} Portions)</span>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB: UNIFIED KITCHEN LEDGER & HISTORY */}
          {activeTab === "ledger" && (
            <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-xl space-y-6">
              <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                  <h3 class="font-black text-xl text-slate-900">Kitchen Activity Ledger</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Chronological audit of all additions (credits) and meal depletions (debits)</p>
                </div>
                <span class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-xl">
                  {ledgerEvents.length} Events Logged
                </span>
              </div>

              {ledgerEvents.length === 0 ? (
                <div class="text-center py-12 text-slate-400 text-xs font-bold">
                  No kitchen events recorded yet. Ingest a bill or cook a meal to see logs!
                </div>
              ) : (
                <div class="space-y-3">
                  {ledgerEvents.map(event => (
                    <div
                      key={event.id}
                      class={"p-4 rounded-2xl border flex items-center justify-between transition-all " + (
                        event.type === "CREDIT" ? "bg-emerald-50/70 border-emerald-200" : "bg-orange-50/70 border-orange-200"
                      )}
                    >
                      <div class="flex items-center gap-3">
                        <div class={"w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm " + (
                          event.type === "CREDIT" ? "bg-emerald-200 text-emerald-900" : "bg-orange-200 text-orange-900"
                        )}>
                          {event.type === "CREDIT" ? "+" : "-"}
                        </div>
                        <div>
                          <div class="flex items-center gap-2">
                            <h4 class="font-black text-sm text-slate-900">{event.title}</h4>
                            <span class="text-[10px] text-slate-400 font-semibold">{event.time}</span>
                          </div>
                          <p class="text-xs text-slate-600 mt-0.5">{event.subtitle}</p>
                        </div>
                      </div>

                      <div class="flex items-center gap-3">
                        <span class={"text-xs font-black px-2.5 py-1 rounded-lg " + (
                          event.type === "CREDIT" ? "bg-emerald-200 text-emerald-900" : "bg-orange-200 text-orange-900"
                        )}>
                          {event.amount}
                        </span>

                        {event.logId && (
                          <button
                            onClick={() => handleUndoMeal(event.logId)}
                            class="px-2.5 py-1 bg-white hover:bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm transition-all"
                            title="Undo meal and restore pantry stock"
                          >
                            <Icons.Undo />
                            <span>Undo</span>
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* TAB: RESTOCK RADAR */}
          {activeTab === "radar" && (
            <div class="max-w-3xl mx-auto space-y-6">
              <div class="bg-red-500 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center">
                <div>
                  <h3 class="font-black text-2xl">Restock Radar</h3>
                  <p class="text-xs text-red-100 mt-1">Items currently below their safety thresholds</p>
                </div>
                <div class="text-3xl font-black">{lowStockItems.length}</div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {lowStockItems.map(item => (
                  <div key={item.id} class="bg-white rounded-3xl p-5 border border-red-200 shadow-sm flex justify-between items-center">
                    <div>
                      <h4 class="font-bold text-sm text-slate-900">{item.shortName}</h4>
                      <span class="text-xs text-red-600 font-bold">Only {item.current} {item.unit} left</span>
                    </div>
                    <button
                      onClick={() => updateStock(item.id, item.unit === "g" ? 250 : 2.0)}
                      class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold"
                    >
                      + Restock
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
