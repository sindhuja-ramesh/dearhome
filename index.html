    function App() {
      const [household, setHousehold] = useState(() => {
        const saved = localStorage.getItem("dearhome_household");
        return saved ? JSON.parse(saved) : {
          name: "Ramesh Family",
          adults: 3,
          children: 1,
          elders: 0,
          currentGuests: 0,
          cuisine: "North Indian",
          diet: "Vegetarian",

          staplePreference: "Balanced (50/50)",
          oilIntensity: "Standard Tadka (1.0x)"

      const [pantry, setPantry] = useState(() => {
        const saved = localStorage.getItem("dearhome_pantry");
        return saved ? JSON.parse(saved) : INITIAL_PANTRY;
      });

      const [mealLogs, setMealLogs] = useState(() => {
        const saved = localStorage.getItem("dearhome_meallogs");
        return saved ? JSON.parse(saved) : [];
      });

      const [activeTab, setActiveTab] = useState("assistant");
      const [isAddItemModalOpen, setIsAddItemModalOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("All Items");
      const [searchQuery, setSearchQuery] = useState("");

      const [selectedRecipe, setSelectedRecipe] = useState(INDIAN_RECIPES[0].id);
      const [guestCountForMeal, setGuestCountForMeal] = useState(0);
      const [toast, setToast] = useState(null);

      // CONVERSATIONAL AGENT STATE: First step asks what is present in kitchen
      const [chatMessages, setChatMessages] = useState([
        {
          id: "m-1",
          sender: "ai",
          text: "Namaste Sinduja! I am your DearHome AI Kitchen Assistant. First, what ingredients and groceries are currently present in your kitchen? You can type what you have (e.g. 'I have 2 kg Atta 2 bread packets and 1 kg tomato'), load a standard Indian kitchen starter pack, or scan your grocery bill.",
          suggestions: [
            "I have 2 kg Atta 2 bread packets and 1 kg tomato",
            "I have 5kg Atta, 2kg Basmati Rice, 1kg Toor Dal, Ghee, Milk, and Potatoes",
            "Load standard Indian Kitchen starter pack",
            "What can I cook with what I already have?"
          ]
        }
      ]);
      const [userChatInput, setUserChatInput] = useState("");
      const [isAiThinking, setIsAiThinking] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("dearhome_household", JSON.stringify(household));
      }, [household]);

      useEffect(() => {
        localStorage.setItem("dearhome_pantry", JSON.stringify(pantry));
      }, [pantry]);

      useEffect(() => {
        localStorage.setItem("dearhome_meallogs", JSON.stringify(mealLogs));
      }, [mealLogs]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages, isAiThinking]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      const appetiteMultiplier = useMemo(() => {
        if (household.appetiteLevel && household.appetiteLevel.indexOf("Light") !== -1) return 0.75;
        if (household.appetiteLevel && household.appetiteLevel.indexOf("Hearty") !== -1) return 1.30;
        return 1.0;
      }, [household.appetiteLevel]);

      const baseFamilyServings = useMemo(() => {
        const rawEaters = (household.adults * 1.0) + (household.children * 0.6) + (household.elders * 0.85);
        return Math.max(1, +(rawEaters * appetiteMultiplier).toFixed(1));
      }, [household, appetiteMultiplier]);

      const totalMealEaters = Math.max(1, +(baseFamilyServings + (guestCountForMeal * appetiteMultiplier)).toFixed(1));
      const lowStockItems = useMemo(() => pantry.filter(i => i.current <= i.threshold), [pantry]);

      const updateStock = (id, delta) => {
        setPantry(prev => prev.map(item => {
          if (item.id === id) {
            const nextVal = Math.max(0, +(item.current + delta).toFixed(2));
            return { ...item, current: nextVal };
          }
          return item;
        }));
      };

      const handleCookMealDirect = (recipeId, effectiveServings) => {
        const recipe = INDIAN_RECIPES.find(r => r.id === recipeId);
        if (!recipe) return;

        let deductions = [];
        let updatedPantry = [...pantry];

        recipe.ingredients.forEach(ing => {
          const index = updatedPantry.findIndex(p =>
            p.shortName.toLowerCase() === ing.name.toLowerCase() ||
            p.name.toLowerCase().indexOf(ing.name.toLowerCase()) !== -1 ||
            ing.name.toLowerCase().indexOf(p.shortName.toLowerCase()) !== -1
          );

          if (index !== -1) {
            const item = updatedPantry[index];
            let deductionAmount = ing.qty * effectiveServings;

            if (ing.unit === "g" && item.unit === "kg") deductionAmount /= 1000;
            if (ing.unit === "ml" && item.unit === "L") deductionAmount /= 1000;

            const nextQty = Math.max(0, +(item.current - deductionAmount).toFixed(2));
            updatedPantry[index] = { ...item, current: nextQty };
            deductions.push({ name: item.shortName, qty: (ing.qty * effectiveServings).toFixed(1) + " " + ing.unit });
          }
        });

        setPantry(updatedPantry);

        const newLog = {
          id: "log-" + Date.now(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          recipeName: recipe.name,
          servings: effectiveServings,
          appetite: household.appetiteLevel || "Regular (1.0x)",
          deductions
        };

        setMealLogs(prev => [newLog, ...prev]);
        showToast("Cooked " + recipe.name + " (" + effectiveServings + " portion units). Inventory auto-deducted!");
      };

      // NATURAL LANGUAGE GROCERY PARSER
      const parseGroceriesFromText = (text) => {
        let clean = text.replace(/^(i have|we have|present in my kitchen|in my kitchen|my groceries are|i bought|please add|add|stocked)\s*/i, '');
        const results = [];
        const re = /(\d+(?:\.\d+)?)\s*(kg|g|l|ml|litres|litre|packets|packet|pack|packs|pcs|pieces|bottles|bottle)?\s*(?:of\s+)?([a-zA-Z]+(?:\s+[a-zA-Z]+)?)(?:\s+(packets|packet|pack|packs|pcs|pieces|bottles|bottle))?/gi;
        
        let match;
        while ((match = re.exec(clean)) !== null) {
          let qty = parseFloat(match[1]);
          let unit1 = match[2];
          let rawName = match[3].trim();
          let unit2 = match[4];
          
          rawName = rawName.replace(/^and\s+/i, '').replace(/\s+and$/i, '').trim();
          if (!rawName || ['and', 'have', 'the', 'my', 'in', 'kitchen', 'to', 'for'].includes(rawName.toLowerCase())) continue;
          
          let unit = (unit1 || unit2 || '').toLowerCase();
          if (!unit) {
            if (rawName.match(/\b(packets|packet|pack|packs)\b/i)) unit = 'packets';
            else if (rawName.match(/\b(bottles|bottle)\b/i)) unit = 'bottles';
            else if (rawName.match(/\b(kg|kilo|kilos)\b/i)) unit = 'kg';
            else if (rawName.match(/\b(litres|litre|liter|liters|l)\b/i)) unit = 'L';
            else if (rawName.match(/\b(g|grams|gm)\b/i)) unit = 'g';
            else unit = 'pcs';
          }
          
          if (unit.startsWith('packet') || unit.startsWith('pack')) unit = 'packets';
          else if (unit === 'litres' || unit === 'litre') unit = 'L';
          else if (unit === 'pieces' || unit === 'piece') unit = 'pcs';
          else if (unit === 'kg') unit = 'kg';
          else if (unit === 'g') unit = 'g';
          else if (unit === 'l') unit = 'L';
          else if (unit === 'ml') unit = 'ml';
          
          rawName = rawName.replace(/\s+(packets|packet|pack|packs|bottles|bottle|kg|g|l|ml|pcs)$/i, '').trim();
          const formattedName = rawName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
          results.push({ name: formattedName, qty, unit });
        }
        return results;
      };

      const handleSendMessage = (textToSend) => {
        const query = textToSend || userChatInput;
        if (!query.trim()) return;

        const userMsg = { id: "user-" + Date.now(), sender: "user", text: query };
        setChatMessages(prev => [...prev, userMsg]);
        setUserChatInput("");
        setIsAiThinking(true);

        setTimeout(() => {
          setIsAiThinking(false);
          const lower = query.toLowerCase();

          // 1. STARTER PACK REQUEST
          if (lower.indexOf("starter pack") !== -1 || lower.indexOf("standard indian") !== -1 || lower.indexOf("starter kit") !== -1) {
            setPantry(INITIAL_PANTRY);
            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: "Loaded the Standard Indian Kitchen Starter Pack! Your pantry is now stocked with 24 kitchen essentials:",
                stockedItems: INITIAL_PANTRY.slice(0, 8).map(i => ({ name: i.shortName, qty: i.current + " " + i.unit })),
                totalStockedCount: INITIAL_PANTRY.length,
                suggestions: [
                  "What can I cook with what I have?",
                  "I cooked Dal Tadka and Rice for 4 people today",
                  "Which groceries are running low?"
                ]
              }
            ]);
            showToast("Standard Indian Kitchen Starter Pack Loaded (24 Staples)!");
            return;
          }

          // 2. KITCHEN GROCERY INGESTION (e.g. "I have 2 kg Atta 2 bread packets and 1 kg tomato")
          const isNotQueryingRecipe = lower.indexOf("what can i cook") === -1 && lower.indexOf("cooked") === -1 && lower.indexOf("prepared") === -1 && lower.indexOf("made") === -1;
          const parsedGroceries = parseGroceriesFromText(query);

          if (parsedGroceries.length > 0 && isNotQueryingRecipe) {
            let updatedPantry = [...pantry];
            let confirmedList = [];

            parsedGroceries.forEach((item, idx) => {
              const lowerName = item.name.toLowerCase();
              
              // Find matching pantry item
              let matchIndex = updatedPantry.findIndex(p =>
                p.shortName.toLowerCase() === lowerName ||
                p.name.toLowerCase().indexOf(lowerName) !== -1 ||
                lowerName.indexOf(p.shortName.toLowerCase()) !== -1 ||
                (lowerName.indexOf("atta") !== -1 && p.shortName.indexOf("Atta") !== -1) ||
                (lowerName.indexOf("tomato") !== -1 && p.shortName.indexOf("Tomato") !== -1) ||
                (lowerName.indexOf("potato") !== -1 && p.shortName.indexOf("Potato") !== -1) ||
                (lowerName.indexOf("rice") !== -1 && p.shortName.indexOf("Rice") !== -1) ||
                (lowerName.indexOf("dal") !== -1 && p.shortName.indexOf("Dal") !== -1) ||
                (lowerName.indexOf("milk") !== -1 && p.shortName.indexOf("Milk") !== -1) ||
                (lowerName.indexOf("oil") !== -1 && p.shortName.indexOf("Oil") !== -1) ||
                (lowerName.indexOf("bread") !== -1 && p.shortName.indexOf("Bread") !== -1)
              );

              if (matchIndex !== -1) {
                // Update existing item
                const existing = updatedPantry[matchIndex];
                updatedPantry[matchIndex] = {
                  ...existing,
                  current: item.qty,
                  unit: item.unit || existing.unit,
                  max: Math.max(existing.max, item.qty * 1.5)
                };
                confirmedList.push({ name: existing.shortName, qty: item.qty + " " + (item.unit || existing.unit) });
              } else {
                // Dynamically add new item (e.g., Bread, Butter, Eggs, etc.)
                let category = "Beverages and Snacks";
                if (lowerName.indexOf("milk") !== -1 || lowerName.indexOf("paneer") !== -1 || lowerName.indexOf("curd") !== -1 || lowerName.indexOf("dahi") !== -1 || lowerName.indexOf("butter") !== -1 || lowerName.indexOf("egg") !== -1 || lowerName.indexOf("cheese") !== -1) {
                  category = "Dairy and Fresh";
                } else if (lowerName.indexOf("tomato") !== -1 || lowerName.indexOf("potato") !== -1 || lowerName.indexOf("onion") !== -1 || lowerName.indexOf("vegetable") !== -1 || lowerName.indexOf("garlic") !== -1 || lowerName.indexOf("ginger") !== -1) {
                  category = "Vegetables";
                } else if (lowerName.indexOf("bread") !== -1 || lowerName.indexOf("biscuit") !== -1 || lowerName.indexOf("tea") !== -1 || lowerName.indexOf("coffee") !== -1 || lowerName.indexOf("sugar") !== -1 || lowerName.indexOf("snack") !== -1) {
                  category = "Beverages and Snacks";
                } else if (lowerName.indexOf("oil") !== -1 || lowerName.indexOf("ghee") !== -1) {
                  category = "Oils and Ghee";
                } else if (lowerName.indexOf("dal") !== -1 || lowerName.indexOf("rajma") !== -1 || lowerName.indexOf("chana") !== -1) {
                  category = "Dals and Pulses";
                } else if (lowerName.indexOf("atta") !== -1 || lowerName.indexOf("flour") !== -1 || lowerName.indexOf("rice") !== -1 || lowerName.indexOf("poha") !== -1) {
                  category = "Atta and Grains";
                }

                const newItem = {
                  id: "item-" + Date.now() + "-" + idx,
                  name: item.name,
                  shortName: item.name,
                  category: category,
                  current: item.qty,
                  max: item.qty * 1.5,
                  unit: item.unit,
                  threshold: Math.max(1, +(item.qty * 0.25).toFixed(1)),
                  dailyBurn: 0.1,
                  price: 45
                };
                updatedPantry = [newItem, ...updatedPantry];
                confirmedList.push({ name: item.name, qty: item.qty + " " + item.unit });
              }
            });

            setPantry(updatedPantry);
            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: "Great! I have added and updated " + confirmedList.length + " items in your kitchen grocery list and digital pantry:",
                stockedItems: confirmedList,
                totalStockedCount: confirmedList.length,
                suggestions: [
                  "What can I cook with what I have?",
                  "I cooked Dal Tadka and Rice for 4 people today",
                  "Which groceries are running low?"
                ]
              }
            ]);
            showToast("Added " + confirmedList.map(c => c.qty + " " + c.name).join(", ") + " to your grocery list!");
            return;
          }

          // 3. RECIPE SUGGESTIONS
          if (lower.indexOf("what can i cook") !== -1 || lower.indexOf("suggest") !== -1 || lower.indexOf("recipe") !== -1 || lower.indexOf("available") !== -1 || lower.indexOf("dinner") !== -1 || lower.indexOf("lunch") !== -1 || lower.indexOf("video") !== -1 || lower.indexOf("youtube") !== -1) {
            const hasAtta = (pantry.find(i => i.shortName.indexOf("Atta") !== -1)?.current || 0) >= 0.5;
            const hasRice = (pantry.find(i => i.shortName.indexOf("Rice") !== -1)?.current || 0) >= 0.5;
            const hasPaneer = (pantry.find(i => i.shortName.indexOf("Paneer") !== -1)?.current || 0) >= 100;
            const hasDal = (pantry.find(i => i.shortName.indexOf("Toor Dal") !== -1)?.current || 0) >= 0.2;
            const hasRajma = (pantry.find(i => i.shortName.indexOf("Rajma") !== -1)?.current || 0) >= 0.3;
            const hasAloo = (pantry.find(i => i.shortName.indexOf("Potato") !== -1)?.current || 0) >= 0.5;

            let suggestionsList = [];
            if (hasAtta && hasAloo) {
              const r = INDIAN_RECIPES[2];
              suggestionsList.push({ ...r, reason: "Atta and Potatoes present in kitchen" });
            }
            if (hasDal && hasRice) {
              const r = INDIAN_RECIPES[0];
              suggestionsList.push({ ...r, reason: "Toor Dal and Basmati Rice ready in stock" });
            }
            if (hasPaneer && hasAtta) {
              const r = INDIAN_RECIPES[3];
              suggestionsList.push({ ...r, reason: "Fresh Malai Paneer and Atta ready" });
            }
            if (hasRajma && hasRice) {
              const r = INDIAN_RECIPES[1];
              suggestionsList.push({ ...r, reason: "Rajma and Basmati ready in stock" });
            }
            if (suggestionsList.length === 0) {
              suggestionsList.push(INDIAN_RECIPES[0]);
              suggestionsList.push(INDIAN_RECIPES[4]);
            }

            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: "Based on the groceries present in your kitchen, here are delicious recipes you can prepare right now, complete with YouTube video tutorials and step-by-step guides:",
                dishRecommendations: suggestionsList,
                suggestions: ["What groceries are running low?", "I cooked one of these dishes", "Update what is in my kitchen"]
              }
            ]);
          }
          // 4. MEAL LOGGING & DEDUCTION
          else if (lower.indexOf("cook") !== -1 || lower.indexOf("made") !== -1 || lower.indexOf("prepared") !== -1 || lower.indexOf("ate") !== -1 || lower.indexOf("dal") !== -1 || lower.indexOf("paratha") !== -1 || lower.indexOf("rajma") !== -1 || lower.indexOf("poha") !== -1 || lower.indexOf("chai") !== -1) {
            let matchedRecipe = INDIAN_RECIPES.find(r => lower.indexOf(r.name.toLowerCase()) !== -1 || lower.indexOf(r.id.toLowerCase()) !== -1 || lower.indexOf(r.cuisine.toLowerCase()) !== -1);
            if (!matchedRecipe) {
              if (lower.indexOf("dal") !== -1 || lower.indexOf("rice") !== -1) matchedRecipe = INDIAN_RECIPES[0];
              else if (lower.indexOf("rajma") !== -1) matchedRecipe = INDIAN_RECIPES[1];
              else if (lower.indexOf("paratha") !== -1 || lower.indexOf("aloo") !== -1) matchedRecipe = INDIAN_RECIPES[2];
              else if (lower.indexOf("paneer") !== -1) matchedRecipe = INDIAN_RECIPES[3];
              else if (lower.indexOf("poha") !== -1) matchedRecipe = INDIAN_RECIPES[4];
              else if (lower.indexOf("chai") !== -1 || lower.indexOf("tea") !== -1) matchedRecipe = INDIAN_RECIPES[5];
              else matchedRecipe = INDIAN_RECIPES[0];
            }

            let effectiveDiners = baseFamilyServings;
            const numberMatch = lower.match(/\b([1-9]|10)\b/);
            if (numberMatch) effectiveDiners = +(parseInt(numberMatch[0]) * appetiteMultiplier).toFixed(1);

            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: "Understood! Prepared " + matchedRecipe.name + " (" + effectiveDiners + " portion units). Click below to auto-deduct ingredients from your kitchen stock or watch the recipe tutorial:",
                actionableMeal: {
                  recipe: matchedRecipe,
                  servings: effectiveDiners
                },
                suggestions: ["What can I cook for next meal?", "Check pantry levels", "Update what is in my kitchen"]
              }
            ]);
          }
          // 5. LOW STOCK RADAR
          else if (lower.indexOf("low") !== -1 || lower.indexOf("stock") !== -1 || lower.indexOf("radar") !== -1 || lower.indexOf("empty") !== -1 || lower.indexOf("running out") !== -1) {
            const lowItemsNames = lowStockItems.map(i => i.shortName + " (" + i.current + " " + i.unit + " left)").join(", ");
            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: lowStockItems.length > 0
                  ? "Warning: You have " + lowStockItems.length + " items running low in your kitchen: " + lowItemsNames + ". I recommend restocking them today!"
                  : "All grocery staples in your kitchen pantry are above safety threshold! You are fully stocked.",
                suggestions: ["What can I cook with what I have?", "Simulate Zepto Order Sync", "Update what is in my kitchen"]
              }
            ]);
          }
          // 6. DEFAULT FALLBACK
          else {
            setChatMessages(prev => [
              ...prev,
              {
                id: "ai-" + Date.now(),
                sender: "ai",
                text: "I am ready to help manage your kitchen! You can tell me what groceries are present in your kitchen (e.g. 'I have 2 kg Atta 2 bread packets and 1 kg tomato'), ask for recipe suggestions with YouTube tutorials, or tell me what meal you cooked today.",
                suggestions: [
                  "I have 2 kg Atta 2 bread packets and 1 kg tomato",
                  "What can I cook with my current pantry?",
                  "I cooked Dal Tadka for 4 people today"
                ]
              }
            ]);
          }
        }, 500);
      };

      const handleQuickSync = (platform) => {
        setPantry(prev => prev.map(item => {
          if (item.shortName.indexOf("Milk") !== -1) return { ...item, current: +(item.current + 2).toFixed(1) };
          if (item.shortName.indexOf("Toor Dal") !== -1) return { ...item, current: +(item.current + 1).toFixed(1) };
          if (item.shortName.indexOf("Tomato") !== -1) return { ...item, current: +(item.current + 1.5).toFixed(1) };
          if (item.shortName.indexOf("Atta") !== -1) return { ...item, current: +(item.current + 5).toFixed(1) };
          return item;
        }));
        showToast("Order Ingested from " + platform + "! Added Milk, Toor Dal, Tomatoes and Atta.");
      };

      const filteredItems = useMemo(() => {
        return pantry.filter(item => {
          const matchesCategory = selectedCategory === "All Items" || item.category === selectedCategory;
          const matchesSearch = item.name.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1 ||
                                item.shortName.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1 ||
                                item.category.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
          return matchesCategory && matchesSearch;
        });
      }, [pantry, selectedCategory, searchQuery]);

      return (
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          
          {/* HEADER */}
          <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 pb-6 border-b border-orange-200/70 mb-6">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 to-orange-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/25">
                <Icons.Home />
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-2xl font-black bg-gradient-to-r from-amber-950 to-orange-700 bg-clip-text text-transparent">
                    DearHome
                  </h1>
                  <span class="text-[10px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md">
                    Cloud Synced
                  </span>
                </div>
                <p class="text-xs text-slate-500 font-medium">Smart Autonomous Indian Kitchen and Grocery Inventory</p>
              </div>
            </div>

            {/* ACTION BUTTONS */}
            <div class="flex flex-wrap items-center gap-3">
              <button
                onClick={() => setActiveTab("assistant")}
                class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-xs shadow-md shadow-orange-500/20 transition-all flex items-center gap-2"
              >
                <Icons.Sparkles />
                <span>AI Kitchen Assistant</span>
              </button>

              <button
                onClick={() => setActiveTab("family")}
                class="px-4 py-2.5 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-800 font-extrabold text-xs shadow-sm transition-all flex items-center gap-2"
              >
                <Icons.Users />
                <span>Family ({household.adults}A, {household.children}K - {household.appetiteLevel.split(" ")[0]})</span>
              </button>

              <button
                onClick={() => setIsAddItemModalOpen(true)}
                class="px-3.5 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-sm transition-all flex items-center gap-1.5"
              >
                <Icons.Plus />
                <span>Add Item</span>
              </button>
            </div>
          </header>

          {/* MAIN NAVIGATION BAR */}
          <nav class="flex gap-2 p-1.5 bg-slate-100/90 rounded-2xl mb-8 overflow-x-auto border border-slate-200/80">
            {[
              { id: "assistant", label: "AI Kitchen Assistant", icon: <Icons.Chat /> },
              { id: "pantry", label: "Digital Pantry", count: pantry.length, icon: <Icons.Box /> },
              { id: "family", label: "Family, Appetite and Guests", icon: <Icons.Users /> },
              { id: "masala", label: "Masala Dabba", count: 5, icon: <Icons.Flame /> },
              { id: "cook", label: "What Did You Cook?", icon: <Icons.Flame /> },
              { id: "radar", label: "Restock Radar", count: lowStockItems.length, alert: lowStockItems.length > 0, icon: <Icons.Alert /> },

              { id: "scan", label: "OCR Bill Scanner", icon: <Icons.Camera /> },
              { id: "analytics", label: "Household Insights", icon: <Icons.Chart /> }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                class={"flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs whitespace-nowrap transition-all " + (
                  activeTab === tab.id
                    ? "bg-white text-orange-800 shadow-sm border border-orange-200/80"

                )}
              >
                {tab.icon}
                <span>{tab.label}</span>
                {tab.count !== undefined && tab.count > 0 && (
                  <span class={"text-[10px] px-1.5 py-0.2 rounded-full font-black " + (
                    tab.alert ? "bg-red-500 text-white animate-pulse" : "bg-slate-200 text-slate-700"
                  )}>
                    {tab.count}
                  </span>
                )}
              </button>
            ))}
          </nav>

          {/* TAB 1: CONVERSATIONAL AI KITCHEN ASSISTANT */}
          {activeTab === "assistant" && (
            <div class="max-w-3xl mx-auto space-y-4">
              <div class="bg-gradient-to-r from-amber-600 via-orange-600 to-amber-700 rounded-3xl p-6 text-white shadow-xl flex items-center justify-between">
                <div>
                  <span class="text-[10px] font-black uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">
                    Powered by Google Gemini 2.0 Flash
                  </span>
                  <h2 class="text-2xl font-black mt-2">DearHome Conversational Agent</h2>
                  <p class="text-xs text-orange-100 mt-1">
                    Instant kitchen grocery ingestion, meal suggestions with YouTube tutorials, and live auto-depletion.
                  </p>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center text-white text-2xl border border-white/20">
                  <Icons.Sparkles />
                </div>
              </div>

              <div class="bg-white rounded-3xl p-6 border border-orange-100 shadow-sm min-h-[440px] max-h-[520px] overflow-y-auto space-y-4">
                {chatMessages.map(msg => (
                  <div
                    key={msg.id}
                    class={"flex flex-col " + (msg.sender === "user" ? "items-end" : "items-start")}
                  >
                    <div
                      class={"p-4 rounded-2xl max-w-lg text-xs leading-relaxed " + (
                        msg.sender === "user"
                          ? "bg-slate-900 text-white rounded-br-none"
                          : "bg-orange-50 border border-orange-200/80 text-slate-800 rounded-bl-none shadow-sm"
                      )}
                    >
                      <p class="font-medium">{msg.text}</p>

                      {/* STOCKED KITCHEN ITEMS BADGES */}
                      {msg.stockedItems && (
                        <div class="mt-3 p-3.5 bg-white rounded-2xl border border-emerald-300 shadow-sm space-y-2.5">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-emerald-900 flex items-center gap-1.5">

                      {/* DISH RECOMMENDATION CARDS WITH YOUTUBE AND WEBSITE LINKS */}
                      {msg.dishRecommendations && (
                        <div class="mt-3 space-y-2.5 pt-2 border-t border-orange-200">
                          {msg.dishRecommendations.map((rec, idx) => {
                            const ytSearchUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(rec.youtubeQuery || (rec.name + " Recipe Ranveer Brar"));

                                    <span class="font-extrabold text-sm text-slate-900 block">{rec.name}</span>

                                <div class="flex flex-wrap items-center gap-2 pt-1 border-t border-slate-100">
                                  <a
                                    href={ytSearchUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 font-bold text-[11px] rounded-xl border border-red-200 transition-all"

                                    <Icons.Video />
                                    <span>Watch on YouTube</span>

                                  {rec.recipeUrl && (

                                    >
                                      <Icons.BookOpen />

                        <button
                          onClick={() => updateStock(item.id, item.max - item.current)}
                          class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition-all"
                        >
                          Restock
                        </button>
                      </div>
                    ))}
                  </div>

                  <div class="p-6 bg-white rounded-3xl border border-orange-200 shadow-sm space-y-3">
                    <h3 class="font-bold text-sm text-slate-900">1-Click Quick-Commerce Restock Basket</h3>
                    <p class="text-xs text-slate-500">Auto-packs all {lowStockItems.length} low-stock items into an optimized delivery cart.</p>
                    <div class="flex gap-3">
                      <button
                        onClick={() => handleQuickSync("Zepto Instant")}
                        class="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-2xl font-bold text-xs shadow-sm transition-all"
                      >
                        Order via Zepto (10 mins)
                      </button>
                      <button
                        onClick={() => handleQuickSync("Blinkit")}
                        class="flex-1 py-3 bg-yellow-500 hover:bg-yellow-600 text-slate-950 rounded-2xl font-bold text-xs shadow-sm transition-all"
                      >
                        Order via Blinkit
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 7: ONLINE SYNC */}
          {activeTab === "sync" && (
            <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-lg space-y-6">
              <div>
                <span class="text-xs font-black uppercase text-orange-600 bg-orange-100 px-3 py-1 rounded-full">
                  Omnichannel Quick-Commerce Sync
                </span>
                <h2 class="text-2xl font-black text-slate-900 mt-2">Delivery App Integrations</h2>
                <p class="text-xs text-slate-500 mt-0.5">
                  Simulate live order invoice ingestion from quick-commerce platforms.
                </p>
              </div>

              <div class="grid grid-cols-2 gap-4">
                {[
                  { name: "Zepto Quick", color: "bg-purple-600 hover:bg-purple-700", desc: "10-min groceries" },
                  { name: "Blinkit", color: "bg-yellow-500 hover:bg-yellow-600 text-slate-950", desc: "Instant essentials" },
                  { name: "Swiggy Instamart", color: "bg-orange-600 hover:bg-orange-700", desc: "Superfast delivery" },
                  { name: "Amazon Fresh", color: "bg-slate-900 hover:bg-slate-800", desc: "Bulk kitchen staples" }
                ].map(platform => (
                  <button
                    key={platform.name}
                    onClick={() => handleQuickSync(platform.name)}
                    class={"p-5 rounded-3xl text-white text-left transition-all shadow-md " + platform.color}
                  >
                    <span class="font-black text-sm block">{platform.name}</span>
                    <span class="text-[10px] opacity-80 block mt-1">{platform.desc}</span>
                    <span class="text-[11px] font-bold mt-3 inline-block bg-white/20 px-2 py-0.5 rounded-lg">Sync Order</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* TAB 8: OCR BILL SCANNER */}
          {activeTab === "scan" && (
            <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-orange-200 shadow-lg space-y-6">
              <div>
                <span class="text-xs font-black uppercase text-orange-600 bg-orange-100 px-3 py-1 rounded-full">
                  Gemini Vision OCR Scanner
                </span>
                <h2 class="text-2xl font-black text-slate-900 mt-2">Physical Supermarket Receipt Scanner</h2>
                <p class="text-xs text-slate-500 mt-0.5">
                  Scan printed paper receipts from D-Mart, Reliance Smart Bazaar, or your local Kirana store.
                </p>
              </div>

              <div class="p-8 border-2 border-dashed border-orange-300 rounded-3xl text-center space-y-4 bg-orange-50/50">
                <div class="w-14 h-14 bg-orange-100 text-orange-700 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                  <Icons.Camera />
                </div>
                <div>
                  <h4 class="font-bold text-slate-900">Upload Receipt Photo or PDF</h4>
                  <p class="text-xs text-slate-500 mt-1">Multi-modal AI Vision automatically parses line items and gram weights.</p>
                </div>
                <div class="flex justify-center gap-3">
                  <button
                    onClick={() => {
                      setPantry(prev => prev.map(item => {
                        if (item.shortName.indexOf("Atta") !== -1) return { ...item, current: +(item.current + 10).toFixed(1) };
                        if (item.shortName.indexOf("Rice") !== -1) return { ...item, current: +(item.current + 5).toFixed(1) };
                        if (item.shortName.indexOf("Mustard Oil") !== -1) return { ...item, current: +(item.current + 2).toFixed(1) };
                        return item;
                      }));
                      showToast("Parsed D-Mart Receipt! Ingested 10kg Atta, 5kg Rice, 2L Mustard Oil.");
                    }}
                    class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                  >
                    Simulate D-Mart Bill Scan
                  </button>
                  <button
                    onClick={() => {
                      setPantry(prev => prev.map(item => {
                        if (item.shortName.indexOf("Toor Dal") !== -1) return { ...item, current: +(item.current + 2).toFixed(1) };
                        if (item.shortName.indexOf("Sugar") !== -1) return { ...item, current: +(item.current + 3).toFixed(1) };
                        return item;
                      }));
                      showToast("Parsed Kirana Store Bill! Ingested 2kg Toor Dal and 3kg Sugar.");
                    }}
                    class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 font-bold text-xs rounded-xl shadow-sm transition-all"
                  >
                    Simulate Kirana Bill Scan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TAB 9: HOUSEHOLD ANALYTICS */}
          {activeTab === "analytics" && (
            <div class="max-w-3xl mx-auto space-y-6">
              <div class="bg-gradient-to-r from-slate-900 to-slate-800 rounded-3xl p-6 text-white shadow-xl flex items-center justify-between">
                <div>
                  <span class="text-[10px] font-black uppercase tracking-wider bg-orange-500 px-3 py-1 rounded-full">
                    Consumption Intelligence
                  </span>
                  <h2 class="text-2xl font-black mt-2">Household Burn Rate Analytics</h2>
                  <p class="text-xs text-slate-300 mt-1">
                    Based on {household.adults} Adults, {household.children} Children, and {household.appetiteLevel} appetite calibration.
                  </p>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center text-white text-2xl border border-white/20">
                  <Icons.Chart />
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                {[
                  { label: "Atta (Wheat)", value: (0.38 * 30 * appetiteMultiplier).toFixed(1) + " kg" },
                  { label: "Basmati Rice", value: (0.22 * 30 * appetiteMultiplier).toFixed(1) + " kg" },
                  { label: "Cooking Oils", value: (0.15 * 30 * appetiteMultiplier).toFixed(1) + " L" },
                  { label: "Monthly Milk", value: (1.0 * 30 * appetiteMultiplier).toFixed(0) + " L" }
                ].map((item, idx) => (
                  <div key={idx} class="bg-white p-5 rounded-3xl border border-orange-100 text-center shadow-sm">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">{item.label}</span>
                    <span class="text-xl font-black text-slate-900 my-1 block">{item.value}</span>
                    <span class="text-[10px] text-slate-500 font-semibold">per month</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* MODAL: ADD CUSTOM PANTRY ITEM */}
          {isAddItemModalOpen && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-modal">
              <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 border border-orange-100 shadow-2xl space-y-5 relative">
                <button
                  onClick={() => setIsAddItemModalOpen(false)}
                  class="absolute right-5 top-5 p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100"
                >
                  <Icons.Close />
                </button>

                <h2 class="text-xl font-black text-slate-900">Add New Grocery Staple</h2>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const name = e.target.name.value;
                    const category = e.target.category.value;
                    const unit = e.target.unit.value;
                    const qty = parseFloat(e.target.qty.value) || 1.0;

                    if (name) {
                      setPantry(prev => [{
                        id: "item-" + Date.now(),
                        name: name,
                        shortName: name,
                        category: category,
                        current: qty,
                        max: qty * 1.5,
                        unit: unit,
                        threshold: qty * 0.25,
                        dailyBurn: 0.05,
                        price: 50
                      }, ...prev]);
                      setIsAddItemModalOpen(false);
                      showToast("Added " + name + " to your digital pantry!");
                    }
                  }}
                  class="space-y-4"
                >
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Item Name</label>
                    <input
                      name="name"
                      type="text"
                      placeholder="e.g. Fortune Besan (Gram Flour)"
                      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"
                      required
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Category</label>
                      <select name="category" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
                        {CATEGORIES.filter(c => c !== "All Items").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Unit</label>
                      <select name="unit" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="L">L</option>
                        <option value="ml">ml</option>
                        <option value="packets">packets</option>
                        <option value="pcs">pcs</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Current Quantity</label>
                    <input
                      name="qty"
                      type="number"
                      step="0.1"
                      defaultValue="1.0"
                      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm"
                  >
                    Add to Stock
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FLOATING TOAST NOTIFICATION */}
          {toast && (
            <div class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold border border-slate-700 animate-modal flex items-center gap-2.5">
              <Icons.Check />
              <span>{toast}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
