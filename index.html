  const preprocessImageForOcr = dataUrl => {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxDim = 2200;
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        } else if (w < 900) {
          const ratio = 1200 / w;
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);

        // Grayscale + Adaptive Contrast Stretch
        try {
          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;
          let minLum = 255;
          let maxLum = 0;
          for (let i = 0; i < d.length; i += 4) {
            const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            if (lum < minLum) minLum = lum;
            if (lum > maxLum) maxLum = lum;
          }
          const range = Math.max(1, maxLum - minLum);
          for (let i = 0; i < d.length; i += 4) {
            let lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            lum = (lum - minLum) / range * 255;
            if (lum < 115) lum = lum * 0.75; // Darken faint text
            else if (lum > 135) lum = Math.min(255, lum * 1.15 + 15); // Whiten paper
            d[i] = lum;
            d[i + 1] = lum;
            d[i + 2] = lum;
          }
          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL("image/jpeg", 0.95));
        } catch (e) {
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  };

  // Advanced Indian Grocery Line-Item & Layout Parser
  const parseRawTextToGroceryItems = fullText => {
    if (!fullText || !fullText.trim()) return [];
    const rawLines = fullText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const noiseHeaderRegex = /^(store|retail|mart|provision|superfast|order|delivered|date|time|gst|fssai|lic|tax|cash|phone|ph:|tel:|welcome|invoice|receipt|item description|sl no|sno|description)/i;
    const noiseFooterRegex = /^(subtotal|sub total|grand total|net total|item total|total amount|total items|total|net amount|amount payable|round off|balance|paid|cash received|change|savings|discount|delivery fee|handling|bag fee|cgst|sgst|igst|vat|taxable|thank you|visit again|powered by)/i;
    const items = [];
    let bufferName = "";
    for (let i = 0; i < rawLines.length; i++) {
      const line = rawLines[i];
      const lower = line.toLowerCase();

      // Skip divider lines
      if (/^[-=*_#.|/\\~\s]{3,}$/.test(line)) continue;
      if (noiseFooterRegex.test(lower)) continue;

      // Check if whole line is store header / metadata
      if (noiseHeaderRegex.test(lower) && !/\d+\s*(?:kg|g|l|ml|pkt|pack|rs|₹)/i.test(line) && !/\d+\.\d{2}/.test(line)) {
        bufferName = "";
        continue;
      }

      // Strip leading item numbers like "1.", "1)", "1 ", "| 1 "
      let cleanLine = line.replace(/^\|\s*|\s*\|$/g, '').replace(/^\s*\d+[\.\)\-\s]\s*/, '').trim();

      // Skip column headers
      if (/^(item|description|qty|price|rate|amount|sl no|sno)$/i.test(cleanLine.toLowerCase()) || /^(item description|qty price|rate amount|items count)$/i.test(cleanLine.toLowerCase())) {
        bufferName = "";
        continue;
      }

      // Extract price: matches "₹240", "Rs. 112", "45.00", "Rs 971" at line end
      const priceMatch = cleanLine.match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d{2})?)(?:\s*$)/i);
      let rate = "₹50";
      if (priceMatch) {
        const pNum = parseFloat(priceMatch[1]);
        if (pNum > 5) rate = "₹" + Math.round(pNum);
      }

      // Extract weight/volume pack size (e.g., "5kg", "500g", "1 L", "250ml", "100g")
      const weightMatch = cleanLine.match(/(\d+(?:\.\d+)?)\s*(kg|kgs|g|gm|gms|gram|grams|l|ltr|ltrs|liter|liters|litre|litres|ml|pkt|pkts|packets?|packs?|pcs|pieces?)\b/i);

      // Extract count quantity (e.g., "x 2", "2 nos", or number before price column "1   245.00")
      const countMatch = cleanLine.match(/(?:\bx\s*(\d+)\b)|(?:\b(\d+)\s*(?:nos|no|qty|units?)\b)|(?:\s+(\d+)\s+(?:(?:₹|rs\.?|inr)?\s*\d+(?:\.\d{2})?)\s*$)/i);

          rootEl.innerHTML = '<div style="max-width:600px;margin:50px auto;padding:24px;background:#fff;border-radius:16px;border:1px solid #fed7aa;font-family:sans-serif;box-shadow:0 10px 25px rgba(0,0,0,0.05);">' +
            '<h2 style="color:#c2410c;margin-bottom:8px;">⚠️ Kitchen App Initialization Notice</h2>' +
            '<p style="color:#64748b;font-size:14px;margin-bottom:16px;">The app encountered a startup error. Please click the button below to reset cache and reload:</p>' +
            '<pre style="background:#f8fafc;padding:12px;border-radius:8px;font-size:12px;color:#e11d48;overflow-x:auto;">' + err.message + '</pre>' +
            '<button onclick="localStorage.clear();location.reload();" style="margin-top:16px;background:#ea580c;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;">🔄 Reset Cache & Reload</button>' +
            '</div>';
        }
      }
    }

    // Execute immediately if DOM is ready, otherwise on DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDearHome);
    } else {
      initDearHome();
    }
  </script>
</body>
</html>
