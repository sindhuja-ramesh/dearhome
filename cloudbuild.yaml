# ============================================================================
# DearHome - Google Cloud Build CI/CD Pipeline
# ============================================================================
# Builds container and deploys autonomously to Google Cloud Run
# Target GCP Account: gurudhev21@gmail.com
# ============================================================================

steps:
  # Step 1: Verify repository structure and environment
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=================================================="
        echo "🍳 DearHome: AI Smart Kitchen & Zero-Waste Engine"
        echo "Triggered by Commit: $COMMIT_SHA on Branch: $BRANCH_NAME"
        echo "Target Google Cloud Project: $PROJECT_ID"
        echo "=================================================="
        ls -la

  # Step 2: Build the Production Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/dearhome:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/dearhome:latest'
      - '.'

  # Step 3: Push Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/dearhome:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/dearhome:latest'

  # Step 4: Deploy Container Microservice to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'dearhome'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dearhome:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'FIREBASE_PROJECT_ID=$PROJECT_ID,NODE_ENV=production'
      - '--set-secrets'
      - 'GEMINI_API_KEY=Dearhome_api_key:latest'

  # Step 5: Set public access IAM policy (best-effort — requires Cloud Build SA to have run.admin)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run services add-iam-policy-binding dearhome \
          --region=us-central1 \
          --member=allUsers \
          --role=roles/run.invoker || echo "IAM binding skipped - set manually in Cloud Console"
    allowFailure: true

images:
  - 'gcr.io/$PROJECT_ID/dearhome:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/dearhome:latest'

options:
  logging: CLOUD_LOGGING_ONLY
